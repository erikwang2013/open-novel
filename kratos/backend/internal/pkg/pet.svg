<?xml version="1.0" encoding="UTF-8"?>
<!--
  墨灵 —— Open Novel 项目宠物（墨滴悬在书页上，甩尾凝字）。
  动效：呼吸浮动 / 墨身挤压 / 眨眼 / 尾墨摇摆 / 墨点飞溅 / 光晕呼吸（SMIL，零 JS）。
  标记位：MOOD_FACE / MOOD_BADGE，供后端 GET /api/pet.svg 按实时心情注入。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">墨灵 — Open Novel 项目宠物</title>
  <desc id="desc">一滴活过来的墨，悬在摊开的书页上方；尾巴甩出的墨迹落到纸面，凝成 文 / A / あ 三个字，象征全球多语言小说平台。会呼吸浮动、眨眼、尾墨摇摆。</desc>

  <defs>
    <!-- 墨身：左上受光的立体墨色 -->
    <radialGradient id="ink" cx="36%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#485E7F"/>
      <stop offset="62%" stop-color="#2E4057"/>
      <stop offset="100%" stop-color="#1B2635"/>
    </radialGradient>
    <radialGradient id="ground" cx="50%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#FFF9EF"/>
      <stop offset="100%" stop-color="#FDF3E3"/>
    </radialGradient>
    <!-- 光晕与投影都用径向渐变收边，避免出现硬边灰饼 -->
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#2E4057" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2E4057" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="castShadow">
      <stop offset="0%" stop-color="#2E4057" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2E4057" stop-opacity="0"/>
    </radialGradient>
    <!-- 纸面：白里带暖，避免和背景抢 -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F1E4"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#ground)"/>

  <!-- 光晕：随呼吸明暗 -->
  <ellipse cx="256" cy="286" rx="190" ry="170" fill="url(#halo)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4.6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 摊开的书：墨色封皮作底、白页压在上面、下缘跑出画布。
       透视梯形（远边窄、近边宽）才读得出「平摊在桌上」，矩形只会读成卡片。 -->
  <path d="M120 404 Q256 378 392 404 L470 512 L42 512 Z" fill="#2E4057"/>
  <path d="M136 402 Q256 384 376 402 L456 512 L56 512 Z" fill="url(#paper)"/>
  <path d="M136 402 Q256 384 376 402" fill="none" stroke="#E6DCC9" stroke-width="1.5"/>

  <!-- 墨灵投在书页上的影子 -->
  <ellipse cx="266" cy="432" rx="112" ry="20" fill="url(#castShadow)"/>

  <!-- 墨迹落点：晕开的一小滩墨 -->
  <g fill="#2E4057" opacity="0.15">
    <ellipse cx="374" cy="428" rx="18" ry="9"/>
    <ellipse cx="362" cy="434" rx="9" ry="6"/>
  </g>

  <!-- 纸上的字：已写下的三个字，右侧留白给正在落下的墨 -->
  <g font-family="'Noto Sans','PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" text-anchor="middle" fill="#2E4057">
    <text x="152" y="462" font-size="34">文
      <animate attributeName="opacity" values="0.84;1;0.84" dur="5.4s" begin="0.9s" repeatCount="indefinite"/>
    </text>
    <text x="256" y="462" font-size="34">A
      <animate attributeName="opacity" values="0.84;1;0.84" dur="5.4s" begin="0.45s" repeatCount="indefinite"/>
    </text>
    <text x="360" y="462" font-size="34">あ
      <animate attributeName="opacity" values="0.84;1;0.84" dur="5.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- 墨点飞溅 -->
  <g fill="#2E4057">
    <circle cx="392" cy="428" r="3.5"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="388" cy="442" r="2.4"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.8s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="446" r="2.8"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 墨灵本体：浮动（外层）＋ 墨身挤压（以墨身中心为轴，墨是液体） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <g transform="translate(256,224)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1; 1.025 0.975; 1 1" dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
        <g transform="translate(-256,-224)">

          <!-- 尾墨：从墨身下缘甩到纸面，先画再被墨身盖住接缝；落点避开已写下的三个字 -->
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-2.4 282 290; 2.4 282 290; -2.4 282 290" dur="4.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
            <path d="M306 268 C348 306 372 360 382 424 C364 374 330 312 268 288 Z" fill="#2E4057"/>
          </g>

          <!-- 墨身：水滴形，尖端朝上 -->
          <path d="M256 96 Q344 186 344 224 A88 88 0 0 1 168 224 Q168 186 256 96 Z" fill="url(#ink)"/>
          <ellipse cx="214" cy="184" rx="27" ry="35" fill="#FFFFFF" opacity="0.13" transform="rotate(-24 214 184)"/>

          <!-- 腮红 -->
          <circle cx="198" cy="250" r="15" fill="#E8927C" opacity="0.42"/>
          <circle cx="314" cy="250" r="15" fill="#E8927C" opacity="0.42"/>

          <!-- 嘴 -->
          <path d="M245 256 Q256 268 267 256" fill="none" stroke="#DCE6F2" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

          <!-- 眨眼：整只眼纵向压扁（墨滴式眨眼），无需眼睑填色 -->
          <g transform="translate(224,218)">
            <g>
              <animateTransform attributeName="transform" type="scale" values="1 1; 1 1; 1 0.08; 1 1; 1 1" keyTimes="0;0.86;0.9;0.94;1" dur="4.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
              <ellipse cx="0" cy="0" rx="21" ry="21" fill="#FFFFFF"/>
              <circle cx="0" cy="2" r="9.5" fill="#1F2C3D"/>
              <circle cx="-5" cy="-3" r="3.5" fill="#FFFFFF"/>
            </g>
          </g>
          <g transform="translate(288,218)">
            <g>
              <animateTransform attributeName="transform" type="scale" values="1 1; 1 1; 1 0.08; 1 1; 1 1" keyTimes="0;0.86;0.9;0.94;1" dur="4.8s" begin="0.12s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
              <ellipse cx="0" cy="0" rx="21" ry="21" fill="#FFFFFF"/>
              <circle cx="0" cy="2" r="9.5" fill="#1F2C3D"/>
              <circle cx="-5" cy="-3" r="3.5" fill="#FFFFFF"/>
            </g>
          </g>

          <!--MOOD_FACE_START--><!--MOOD_FACE_END-->
        </g>
      </g>
    </g>
  </g>

  <!--MOOD_BADGE_START--><!--MOOD_BADGE_END-->

  <!-- 水印 -->
  <text x="440" y="498" text-anchor="end" font-size="12" font-family="sans-serif" fill="#8A93A3" opacity="0.8">https://erik.xyz</text>
</svg>
