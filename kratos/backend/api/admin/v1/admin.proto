syntax = "proto3";

// 管理端服务：仪表盘统计 / 分类 / 标签（T-A-14/16）
// 业务码段 18xxxx；REST 映射 /api/stats/overview、/api/admin/categories、/api/admin/tags
package admin.v1;

import "google/api/annotations.proto";

option go_package = "open-novel/backend/api/admin/v1;v1";

service Admin {
  // 仪表盘统计：书籍/用户/评论数、DAU 近似、热门书籍/热门搜索词（requireAdmin）
  rpc GetStats(GetStatsReq) returns (GetStatsReply) {
    option (google.api.http) = {
      get: "/api/stats/overview"
    };
  }
  // 审计日志分页查询（requireAdmin，支持用户/动作/目标/时间范围筛选）
  rpc ListAuditLogs(ListAuditLogsReq) returns (ListAuditLogsReply) {
    option (google.api.http) = {
      get: "/api/admin/audit-logs"
    };
  }
  // 分类列表（requireAdmin，全量返回，量小）
  // 独立路径 /api/admin/categories：与 book 服务公开 GET /api/categories 区分（gorilla/mux 先注册优先）
  rpc ListCategories(ListCategoriesReq) returns (ListCategoriesReply) {
    option (google.api.http) = {
      get: "/api/admin/categories"
    };
  }
  rpc CreateCategory(CreateCategoryReq) returns (CategoryReply) {
    option (google.api.http) = {
      post: "/api/categories"
      body: "*"
    };
  }
  // 更新分类；字段可选，仅更新非空项
  rpc UpdateCategory(UpdateCategoryReq) returns (CategoryReply) {
    option (google.api.http) = {
      put: "/api/categories/{id}"
      body: "*"
    };
  }
  rpc DeleteCategory(DeleteCategoryReq) returns (EmptyReply) {
    option (google.api.http) = {
      delete: "/api/categories/{id}"
    };
  }
  // 标签列表（requireAdmin）
  rpc ListTags(ListTagsReq) returns (ListTagsReply) {
    option (google.api.http) = {
      get: "/api/admin/tags"
    };
  }
  rpc CreateTag(CreateTagReq) returns (TagReply) {
    option (google.api.http) = {
      post: "/api/tags"
      body: "*"
    };
  }
  rpc UpdateTag(UpdateTagReq) returns (TagReply) {
    option (google.api.http) = {
      put: "/api/tags/{id}"
      body: "*"
    };
  }
  rpc DeleteTag(DeleteTagReq) returns (EmptyReply) {
    option (google.api.http) = {
      delete: "/api/tags/{id}"
    };
  }
  // 翻译书籍标题与简介到指定语言（requireAdmin；源文本取书籍原始语言，DeepL）
  rpc TranslateBook(TranslateBookReq) returns (TranslateBookReply) {
    option (google.api.http) = {
      post: "/api/admin/translate/book/{book_id}"
      body: "*"
    };
  }
  // 翻译书籍全部章节到指定语言（requireAdmin；同步串行，单章失败不中断）
  rpc TranslateBookChapters(TranslateBookChaptersReq) returns (TranslateBookChaptersReply) {
    option (google.api.http) = {
      post: "/api/admin/translate/book/{book_id}/chapters"
      body: "*"
    };
  }
  // 报表：订单收入/用户增长/VIP 订阅/内容互动（requireAdmin；start_date/end_date YYYY-MM-DD，缺省近 30 天，含首尾）
  rpc GetReports(GetReportsReq) returns (GetReportsReply) {
    option (google.api.http) = {
      get: "/api/admin/reports"
    };
  }
}

message GetStatsReq {}

message GetStatsReply {
  int64 book_count = 1;
  int64 user_count = 2;
  int64 comment_count = 3;
  int64 dau = 4; // DAU 近似：当日登录 + 当日搜索的去重用户
  repeated HotBook hot_books = 5; // 热门书籍（复用搜索热门榜）
  repeated HotKeyword hot_keywords = 6; // 热门搜索词（搜索日志聚合）
  int64 order_count = 7;   // 累计支付订单数（status=1 已支付）
  int64 order_amount = 8;  // 累计支付金额（分）
  int64 vip_count = 9;     // VIP 有效订阅数（vip_expires_at > now）
  int64 today_new_users = 10; // 今日新增用户
  int64 pending_comments = 11; // 待审核评论数（status=2 举报待审）
  int64 pending_reports = 12;  // 待处理举报数（status=2 评论的 report_count 累计）
}

message HotBook {
  int64 book_id = 1;
  string title = 2;
  int64 hot = 3;
}

message HotKeyword {
  string keyword = 1;
  int64 count = 2;
}

message CategoryReply {
  int64 id = 1;
  string name = 2;
  int64 parent_id = 3;
  int32 sort_order = 4;
  int32 status = 5;
  string created_at = 6; // RFC3339
}

message ListCategoriesReq {}
message ListCategoriesReply {
  repeated CategoryReply list = 1;
  int64 total = 2;
}

message CreateCategoryReq {
  string name = 1;
  int64 parent_id = 2; // 0=一级分类
  int32 sort_order = 3;
}

message UpdateCategoryReq {
  int64 id = 1;
  optional string name = 2;
  optional int64 parent_id = 3;
  optional int32 sort_order = 4;
  optional int32 status = 5; // 0 禁用 1 启用
}

message DeleteCategoryReq {
  int64 id = 1;
}

message TagReply {
  int64 id = 1;
  string name = 2;
  string lang = 3;
  int32 status = 4;
  string created_at = 5; // RFC3339
}

message ListTagsReq {}
message ListTagsReply {
  repeated TagReply list = 1;
  int64 total = 2;
}

message CreateTagReq {
  string name = 1;
  string lang = 2; // 缺省 zh-CN
}

message UpdateTagReq {
  int64 id = 1;
  optional string name = 2;
  optional string lang = 3;
  optional int32 status = 4; // 0 禁用 1 启用
}

message DeleteTagReq {
  int64 id = 1;
}

message EmptyReply {}

message TranslateBookReq {
  int64 book_id = 1;
  string lang = 2; // 目标语言（zh-CN/en/ja/ko/fr/de/es/ru/pt/hi/ar/id；bn 不支持）
}

message TranslateBookReply {
  int64 book_id = 1;
  string lang = 2;
  string title = 3;   // 翻译后的标题
  string summary = 4; // 翻译后的简介
}

message TranslateBookChaptersReq {
  int64 book_id = 1;
  string lang = 2;
}

message TranslateBookChaptersReply {
  int64 book_id = 1;
  string lang = 2;
  int32 total = 3;
  int32 succeeded = 4;
  int32 failed = 5;
  repeated int32 failed_chapters = 6; // 失败章节号（chapter_no）
}

message ListAuditLogsReq {
  int64 page = 1;
  int64 page_size = 2;
  int64 user_id = 3; // 0=全部
  string action = 4; // 空=全部
  string target_type = 5; // 空=全部
  int64 target_id = 6; // 0=全部
  string start_time = 7; // created_at >=（RFC3339 或日期）
  string end_time = 8; // created_at <=
}

message AuditLogReply {
  int64 id = 1;
  int64 user_id = 2;
  string action = 3;
  string target_type = 4;
  int64 target_id = 5;
  string detail = 6;
  string ip = 7;
  string user_agent = 8;
  string created_at = 9; // RFC3339
}

message ListAuditLogsReply {
  repeated AuditLogReply list = 1;
  int64 total = 2;
}

// GetReports 报表请求；日期 YYYY-MM-DD，空=近 30 天（含首尾），服务端兜底区间。
message GetReportsReq {
  string start_date = 1; // YYYY-MM-DD，空=end_date-29 天
  string end_date = 2;   // YYYY-MM-DD，空=start_date+29 天
}

message GetReportsReply {
  OrderReport order_report = 1;
  UserReport user_report = 2;
  VipReport vip_report = 3;
  ContentReport content_report = 4;
}

// 订单报表：仅统计已支付（status=1）订单；amount 为分（库中 DECIMAL(10,2) 元×100）。
message OrderReport {
  int64 total_count = 1;
  int64 total_amount = 2;
  repeated DateAmountPoint by_date = 3;
  repeated ChannelAmountPoint by_channel = 4;
}

message UserReport {
  int64 total_users = 1;
  repeated DateCountPoint by_date = 2; // by_date: 每日新增+累计
}

// VIP 订阅报表：仅统计已支付（status=1）订单；amount 为分。
message VipReport {
  int64 total_count = 1;
  int64 total_amount = 2;
  repeated DateAmountPoint by_date = 3;
  repeated PlanAmountPoint by_plan = 4;
}

// 内容互动报表：新增书籍/章节按日；评论/举报为累计量。
message ContentReport {
  repeated DateCountPoint books_by_date = 1;
  repeated DateCountPoint chapters_by_date = 2;
  int64 comment_count = 3;
  int64 report_count = 4;
}

message DateAmountPoint {
  string date = 1; // YYYY-MM-DD
  int64 count = 2;
  int64 amount = 3; // amount 与库中金额单位一致（分）
}

message DateCountPoint {
  string date = 1; // YYYY-MM-DD
  int64 count = 2;
}

message ChannelAmountPoint {
  string channel = 1; // channel=支付渠道 code（provider）
  int64 count = 2;
  int64 amount = 3;
}

message PlanAmountPoint {
  int64 plan_id = 1;
  string plan_name = 2;
  int64 count = 3;
  int64 amount = 4;
}
