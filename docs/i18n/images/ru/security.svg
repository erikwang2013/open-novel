<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="756" viewBox="0 0 1000 756" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/>
    </marker>
  </defs>

  <text x="44" y="34" font-size="22" font-weight="700" fill="#263238">Open Novel — архитектура безопасности</text>
  <text x="44" y="54" font-size="12" fill="#78909c">Security Architecture</text>

  <!-- 传输安全 -->
  <g>
    <rect x="44" y="80" width="912" height="112" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <rect x="60" y="92" width="86" height="24" rx="6" fill="#1e88e5"/>
    <text x="103" y="108" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Транспорт</text>
    <text x="154" y="108" font-size="11" fill="#1565c0">TRANSPORT</text>

    <g>
      <rect x="60" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="164" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">HTTPS / TLS 1.3</text>
      <text x="164" y="163" font-size="10" fill="#78909c" text-anchor="middle">Шифрование на всех уровнях</text>
    </g>
    <g>
      <rect x="288" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="392" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">HSTS</text>
      <text x="392" y="163" font-size="10" fill="#78909c" text-anchor="middle">Принудительный HTTPS</text>
    </g>
    <g>
      <rect x="516" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="620" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">CDN WAF</text>
      <text x="620" y="163" font-size="10" fill="#78909c" text-anchor="middle">Файрвол WAF</text>
    </g>
    <g>
      <rect x="744" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="848" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Защита от DDoS</text>
      <text x="848" y="163" font-size="10" fill="#78909c" text-anchor="middle">Очистка трафика · защита</text>
    </g>
  </g>

  <line x1="500" y1="196" x2="500" y2="208" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 接入安全 -->
  <g>
    <rect x="44" y="212" width="912" height="168" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
    <rect x="60" y="224" width="86" height="24" rx="6" fill="#5e35b1"/>
    <text x="103" y="240" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Доступ</text>
    <text x="154" y="240" font-size="11" fill="#4527a0">ACCESS</text>

    <g>
      <rect x="60" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="164" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">JWT + RefreshToken</text>
      <text x="164" y="295" font-size="10" fill="#78909c" text-anchor="middle">Два токена</text>
    </g>
    <g>
      <rect x="288" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="392" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">OAuth2 вход через соцсети</text>
      <text x="392" y="295" font-size="10" fill="#78909c" text-anchor="middle">WeChat / Google и др.</text>
    </g>
    <g>
      <rect x="516" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="620" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Лимит запросов (токен-бакет)</text>
      <text x="620" y="295" font-size="10" fill="#78909c" text-anchor="middle">Защита от перебора</text>
    </g>
    <g>
      <rect x="744" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="848" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Валидация (protovalidate)</text>
      <text x="848" y="295" font-size="10" fill="#78909c" text-anchor="middle">Проверка на уровне протокола</text>
    </g>
    <g>
      <rect x="60" y="328" width="440" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="280" y="347" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Обнаружение атак security-go</text>
      <text x="280" y="359" font-size="10" fill="#78909c" text-anchor="middle">27 детектора · Инъекции / протокол / данные / файлы</text>
      <text x="280" y="371" font-size="10" fill="#78909c" text-anchor="middle">High / Critical — блокировка · Low / Medium — журнал</text>
    </g>
    <g>
      <rect x="516" y="328" width="440" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="736" y="352" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Блокировка IP (чёрный список)</text>
      <text x="736" y="366" font-size="10" fill="#78909c" text-anchor="middle">5 атак / 60 с → блокировка на 15 мин</text>
    </g>

  </g>

  <line x1="500" y1="384" x2="500" y2="396" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 业务安全 -->
  <g>
    <rect x="44" y="400" width="912" height="112" rx="12" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
    <rect x="60" y="412" width="86" height="24" rx="6" fill="#fb8c00"/>
    <text x="103" y="428" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Бизнес</text>
    <text x="154" y="428" font-size="11" fill="#e65100">BUSINESS</text>

    <g>
      <rect x="60" y="448" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="144" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">RBAC-права</text>
      <text x="144" y="483" font-size="10" fill="#78909c" text-anchor="middle">Контроль доступа по ролям</text>
    </g>
    <g>
      <rect x="240" y="448" width="168" height="58" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="324" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Проверка подписи платежа</text>
      <text x="324" y="483" font-size="10" fill="#78909c" text-anchor="middle">HMAC / токен · IPN-запрос</text>
    <text x="324" y="499" font-size="10" fill="#78909c" text-anchor="middle">PayPal verify-webhook · Alipay / WeChat RSA</text>
    </g>
    <g>
      <rect x="420" y="448" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="504" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Сумма + идемпотентность</text>
      <text x="504" y="483" font-size="10" fill="#78909c" text-anchor="middle">Сумма callback = сумма заказа</text>
    </g>
    <g>
      <rect x="600" y="448" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="684" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Фильтр XSS</text>
      <text x="684" y="483" font-size="10" fill="#78909c" text-anchor="middle">Экранирование вывода</text>
    </g>
    <g>
      <rect x="780" y="448" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="864" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Защита от SQL-инъекций</text>
      <text x="864" y="483" font-size="10" fill="#78909c" text-anchor="middle">Параметризованные запросы</text>
    </g>
  </g>

  <line x1="500" y1="516" x2="500" y2="528" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 数据安全 -->
  <g>
    <rect x="44" y="532" width="912" height="112" rx="12" fill="#fce4ec" stroke="#d81b60" stroke-width="1.5"/>
    <rect x="60" y="544" width="86" height="24" rx="6" fill="#d81b60"/>
    <text x="103" y="560" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Данные</text>
    <text x="154" y="560" font-size="11" fill="#880e4f">DATA</text>

    <g>
      <rect x="60" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="144" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Шифрование полей AES</text>
      <text x="144" y="615" font-size="10" fill="#78909c" text-anchor="middle">Шифрование хранилища</text>
    </g>
    <g>
      <rect x="240" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="324" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Хэширование паролей</text>
      <text x="324" y="615" font-size="10" fill="#78909c" text-anchor="middle">bcrypt / argon2</text>
    </g>
    <g>
      <rect x="420" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="504" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Управление ключами</text>
      <text x="504" y="615" font-size="10" fill="#78909c" text-anchor="middle">KMS / Vault</text>
    </g>
    <g>
      <rect x="600" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="684" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Шифрование мастер-реплики</text>
      <text x="684" y="615" font-size="10" fill="#78909c" text-anchor="middle">Шифрование репликации</text>
    </g>
    <g>
      <rect x="780" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="864" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Маскирование логов</text>
      <text x="864" y="615" font-size="10" fill="#78909c" text-anchor="middle">Маскирование данных</text>
    </g>
  </g>

  <line x1="500" y1="648" x2="500" y2="660" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 运维安全 -->
  <g>
    <rect x="44" y="664" width="912" height="76" rx="12" fill="#eceff1" stroke="#37474f" stroke-width="1.5"/>
    <rect x="60" y="676" width="86" height="24" rx="6" fill="#37474f"/>
    <text x="103" y="692" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Операции</text>
    <text x="154" y="692" font-size="11" fill="#455a64">OPS</text>

    <g>
      <rect x="258" y="676" width="200" height="36" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
      <text x="358" y="698" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Аудит-логи</text>
    </g>
    <g>
      <rect x="482" y="676" width="200" height="36" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
      <text x="582" y="698" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Канареечные релизы</text>
    </g>
    <g>
      <rect x="706" y="676" width="200" height="36" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
      <text x="806" y="698" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Сканирование уязвимостей</text>
    </g>
    <text x="806" y="720" font-size="10" fill="#78909c" text-anchor="middle">golangci-lint / govulncheck</text>
  </g>

  <text x="500" y="744" font-size="12" fill="#78909c" text-anchor="middle">Эшелонированная защита: транспорт → доступ → бизнес → данные → эксплуатация</text>
  <text x="988" y="744" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
</svg>
