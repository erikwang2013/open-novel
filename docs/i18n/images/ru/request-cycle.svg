<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/>
    </marker>
  </defs>

  <text x="44" y="34" font-size="22" font-weight="700" fill="#263238">Open Novel — жизненный цикл запроса</text>
  <text x="44" y="54" font-size="12" fill="#78909c">Request Lifecycle</text>

  <!-- ① 客户端发起请求 -->
  <g>
    <rect x="220" y="84" width="560" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <text x="500" y="103" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">Клиент отправляет запрос</text>
    <text x="500" y="119" font-size="10" fill="#78909c" text-anchor="middle">Flutter / HarmonyOS</text>
  </g>
  <text x="800" y="112" font-size="13" font-weight="600" fill="#90a4ae">①</text>
  <line x1="500" y1="128" x2="500" y2="156" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ② Nginx + CDN -->
  <g>
    <rect x="220" y="156" width="560" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <text x="500" y="175" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">Nginx + CDN</text>
    <text x="500" y="191" font-size="10" fill="#78909c" text-anchor="middle">Статика · завершение HTTPS</text>
  </g>
  <text x="800" y="184" font-size="13" font-weight="600" fill="#90a4ae">②</text>
  <line x1="500" y1="200" x2="500" y2="228" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ③ Go-Kratos API 网关 -->
  <g>
    <rect x="220" y="228" width="560" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <text x="500" y="247" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">Go-Kratos API-шлюз</text>
    <text x="500" y="263" font-size="10" fill="#78909c" text-anchor="middle">JWT → лимит запросов → валидация</text>
  </g>
  <text x="800" y="256" font-size="13" font-weight="600" fill="#90a4ae">③</text>
  <line x1="500" y1="272" x2="500" y2="300" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ④ 服务层处理 -->
  <g>
    <rect x="220" y="300" width="560" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <text x="500" y="319" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">Обработка в сервисном слое</text>
    <text x="500" y="335" font-size="10" fill="#78909c" text-anchor="middle">Микросервисы: пользователи / книги / главы / поиск</text>
  </g>
  <text x="800" y="328" font-size="13" font-weight="600" fill="#90a4ae">④</text>
  <line x1="500" y1="344" x2="500" y2="372" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ⑤ 缓存判断（菱形） -->
  <text x="388" y="360" font-size="13" font-weight="600" fill="#90a4ae">⑤</text>
  <polygon points="500,372 600,400 500,428 400,400" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
  <text x="500" y="405" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">Кэш Redis?</text>

  <!-- 命中分支 -->
  <line x1="600" y1="400" x2="640" y2="400" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="618" y="392" font-size="11" fill="#00897b" text-anchor="middle">Попадание</text>
  <g>
    <rect x="650" y="372" width="230" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
    <text x="765" y="391" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Возврат данных из кэша</text>
    <text x="765" y="407" font-size="10" fill="#78909c" text-anchor="middle">Без запроса к БД</text>
  </g>
  <line x1="765" y1="416" x2="765" y2="600" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 未命中分支 -->
  <text x="512" y="442" font-size="11" fill="#fb8c00" text-anchor="middle">Промах</text>
  <line x1="500" y1="428" x2="500" y2="460" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="220" y="460" width="560" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
    <text x="500" y="479" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">Запрос MySQL (таблицы novel_*)</text>
    <text x="500" y="495" font-size="10" fill="#78909c" text-anchor="middle">Чтение мастера · один запрос</text>
  </g>
  <line x1="500" y1="504" x2="500" y2="532" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="220" y="532" width="560" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
    <text x="500" y="551" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">Запись обратно в Redis</text>
    <text x="500" y="567" font-size="10" fill="#78909c" text-anchor="middle">TTL 5 мин · далее из кэша</text>
  </g>
  <line x1="500" y1="576" x2="500" y2="600" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ⑥ 返回响应 -->
  <g>
    <rect x="220" y="600" width="560" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <text x="500" y="619" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">Ответ · трейсинг и логирование</text>
    <text x="500" y="635" font-size="10" fill="#78909c" text-anchor="middle">Метрики Prometheus / логи ELK</text>
  </g>
  <text x="800" y="628" font-size="13" font-weight="600" fill="#90a4ae">⑥</text>
  <text x="988" y="648" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
</svg>
