<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="756" viewBox="0 0 1000 756" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/>
    </marker>
  </defs>

  <text x="44" y="34" font-size="22" font-weight="700" fill="#263238">Open Novel — المعمارية الأمنية</text>
  <text x="44" y="54" font-size="12" fill="#78909c">Security Architecture</text>

  <!-- أمان النقل -->
  <g>
    <rect x="44" y="80" width="912" height="112" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <rect x="60" y="92" width="86" height="24" rx="6" fill="#1e88e5"/>
    <text x="103" y="108" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">أمان النقل</text>
    <text x="154" y="108" font-size="11" fill="#1565c0">TRANSPORT</text>

    <g>
      <rect x="60" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="164" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">HTTPS / TLS 1.3</text>
      <text x="164" y="163" font-size="10" fill="#78909c" text-anchor="middle">تشفير كامل للنقل</text>
    </g>
    <g>
      <rect x="288" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="392" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">HSTS</text>
      <text x="392" y="163" font-size="10" fill="#78909c" text-anchor="middle">إعادة توجيه إجبارية إلى HTTPS</text>
    </g>
    <g>
      <rect x="516" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="620" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">CDN WAF</text>
      <text x="620" y="163" font-size="10" fill="#78909c" text-anchor="middle">جدار حماية تطبيقات الويب</text>
    </g>
    <g>
      <rect x="744" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="848" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">حماية من DDoS</text>
      <text x="848" y="163" font-size="10" fill="#78909c" text-anchor="middle">تنظيف الحركة · حماية عالية</text>
    </g>
  </g>

  <line x1="500" y1="196" x2="500" y2="208" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- أمان الوصول -->
  <g>
    <rect x="44" y="212" width="912" height="168" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
    <rect x="60" y="224" width="86" height="24" rx="6" fill="#5e35b1"/>
    <text x="103" y="240" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">أمان الوصول</text>
    <text x="154" y="240" font-size="11" fill="#4527a0">ACCESS</text>

    <g>
      <rect x="60" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="164" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">مصادقة JWT + RefreshToken</text>
      <text x="164" y="295" font-size="10" fill="#78909c" text-anchor="middle">آلية الرمزين المزدوجين</text>
    </g>
    <g>
      <rect x="288" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="392" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">تسجيل دخول OAuth2 عبر طرف ثالث</text>
      <text x="392" y="295" font-size="10" fill="#78909c" text-anchor="middle">WeChat / Google وغيرها</text>
    </g>
    <g>
      <rect x="516" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="620" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">تحديد معدل الواجهات (دلو الرموز)</text>
      <text x="620" y="295" font-size="10" fill="#78909c" text-anchor="middle">حماية من الحرق والهجمات</text>
    </g>
    <g>
      <rect x="744" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="848" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">التحقق من المعلمات (protovalidate)</text>
      <text x="848" y="295" font-size="10" fill="#78909c" text-anchor="middle">تحقق على مستوى البروتوكول</text>
    </g>
    <g>
      <rect x="60" y="328" width="440" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="280" y="347" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">كشف الهجمات security-go</text>
      <text x="280" y="359" font-size="10" fill="#78909c" text-anchor="middle">27 كاشفًا · حقن / بروتوكول / بيانات / ملفات</text>
      <text x="280" y="371" font-size="10" fill="#78909c" text-anchor="middle">حظر High / Critical · Low / Medium سجل فقط</text>
    </g>
    <g>
      <rect x="516" y="328" width="440" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="736" y="352" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">حظر IP بالقائمة السوداء</text>
      <text x="736" y="366" font-size="10" fill="#78909c" text-anchor="middle">5 هجمات / 60 ث → حظر 15 دقيقة</text>
    </g>

  </g>

  <line x1="500" y1="384" x2="500" y2="396" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- أمان الأعمال -->
  <g>
    <rect x="44" y="400" width="912" height="112" rx="12" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
    <rect x="60" y="412" width="86" height="24" rx="6" fill="#fb8c00"/>
    <text x="103" y="428" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">أمان الأعمال</text>
    <text x="154" y="428" font-size="11" fill="#e65100">BUSINESS</text>

    <g>
      <rect x="60" y="448" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="144" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">صلاحيات RBAC</text>
      <text x="144" y="483" font-size="10" fill="#78909c" text-anchor="middle">التحكم بالصلاحيات حسب الدور</text>
    </g>
    <g>
      <rect x="240" y="448" width="168" height="58" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="324" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">التحقق من توقيع الدفع</text>
      <text x="324" y="483" font-size="10" fill="#78909c" text-anchor="middle">HMAC / رمز · إعادة استعلام IPN</text>
    <text x="324" y="499" font-size="10" fill="#78909c" text-anchor="middle">PayPal verify-webhook · Alipay / WeChat RSA</text>
    </g>
    <g>
      <rect x="420" y="448" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="504" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">تحقق المبلغ · Idempotency</text>
      <text x="504" y="483" font-size="10" fill="#78909c" text-anchor="middle">مبلغ الاستدعاء = مبلغ الطلب</text>
    </g>
    <g>
      <rect x="600" y="448" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="684" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">تصفية XSS</text>
      <text x="684" y="483" font-size="10" fill="#78909c" text-anchor="middle">ترميز المخرجات</text>
    </g>
    <g>
      <rect x="780" y="448" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="864" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">حماية من حقن SQL</text>
      <text x="864" y="483" font-size="10" fill="#78909c" text-anchor="middle">استعلامات معلمة</text>
    </g>
  </g>

  <line x1="500" y1="516" x2="500" y2="528" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- أمان البيانات -->
  <g>
    <rect x="44" y="532" width="912" height="112" rx="12" fill="#fce4ec" stroke="#d81b60" stroke-width="1.5"/>
    <rect x="60" y="544" width="86" height="24" rx="6" fill="#d81b60"/>
    <text x="103" y="560" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">أمان البيانات</text>
    <text x="154" y="560" font-size="11" fill="#880e4f">DATA</text>

    <g>
      <rect x="60" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="144" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">تشفير الحقول الحساسة AES</text>
      <text x="144" y="615" font-size="10" fill="#78909c" text-anchor="middle">تشفير التخزين</text>
    </g>
    <g>
      <rect x="240" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="324" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">تجزئة كلمات المرور</text>
      <text x="324" y="615" font-size="10" fill="#78909c" text-anchor="middle">bcrypt / argon2</text>
    </g>
    <g>
      <rect x="420" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="504" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">إدارة المفاتيح</text>
      <text x="504" y="615" font-size="10" fill="#78909c" text-anchor="middle">KMS / Vault</text>
    </g>
    <g>
      <rect x="600" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="684" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">تشفير الرئيسي والتابع</text>
      <text x="684" y="615" font-size="10" fill="#78909c" text-anchor="middle">تشفير رابط النسخ</text>
    </g>
    <g>
      <rect x="780" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="864" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">إخفاء البيانات في السجلات</text>
      <text x="864" y="615" font-size="10" fill="#78909c" text-anchor="middle">إخفاء المعلومات الحساسة</text>
    </g>
  </g>

  <line x1="500" y1="648" x2="500" y2="660" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- أمان التشغيل -->
  <g>
    <rect x="44" y="664" width="912" height="76" rx="12" fill="#eceff1" stroke="#37474f" stroke-width="1.5"/>
    <rect x="60" y="676" width="86" height="24" rx="6" fill="#37474f"/>
    <text x="103" y="692" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">أمان التشغيل</text>
    <text x="154" y="692" font-size="11" fill="#455a64">OPS</text>

    <g>
      <rect x="258" y="676" width="200" height="36" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
      <text x="358" y="698" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">سجلات التدقيق</text>
    </g>
    <g>
      <rect x="482" y="676" width="200" height="36" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
      <text x="582" y="698" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">إصدار تدريجي</text>
    </g>
    <g>
      <rect x="706" y="676" width="200" height="36" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
      <text x="806" y="698" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">فحص الثغرات</text>
    </g>
    <text x="806" y="720" font-size="10" fill="#78909c" text-anchor="middle">golangci-lint / govulncheck</text>
  </g>

  <text x="500" y="744" font-size="12" fill="#78909c" text-anchor="middle">دفاع متعمق: نقل ← وصول ← أعمال ← بيانات ← تشغيل · حماية متعددة الطبقات</text>
  <text x="988" y="744" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
</svg>
