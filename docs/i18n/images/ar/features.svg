    <text x="169" y="536" font-size="11" fill="#546e7a" text-anchor="middle">توصيات AI</text>
    <text x="169" y="553" font-size="11" fill="#546e7a" text-anchor="middle">تصفح حسب التصنيف</text>
    <text x="169" y="570" font-size="11" fill="#546e7a" text-anchor="middle">كلمات البحث الرائجة / اقتراحات البحث</text>
  </g>

  <!-- لوحة الإدارة -->
  <g>
    <rect x="706" y="452" width="250" height="132" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="2"/>
    <rect x="811" y="466" width="40" height="4" rx="2" fill="#546e7a"/>
    <text x="831" y="480" font-size="13" font-weight="700" fill="#546e7a" text-anchor="middle">لوحة الإدارة</text>
    <text x="831" y="502" font-size="11" fill="#546e7a" text-anchor="middle">مراجعة المحتوى</text>
    <text x="831" y="519" font-size="11" fill="#546e7a" text-anchor="middle">إدارة المستخدمين</text>
    <text x="831" y="536" font-size="11" fill="#546e7a" text-anchor="middle">إحصائيات البيانات</text>
    <text x="831" y="553" font-size="11" fill="#546e7a" text-anchor="middle">إدارة الإعدادات</text>
    <text x="831" y="570" font-size="11" fill="#546e7a" text-anchor="middle">إحصائيات البيانات / سجلات التدقيق</text>
  </g>

  <!-- مركز الدفع -->
  <g>
    <rect x="44" y="628" width="250" height="132" rx="8" fill="#ffffff" stroke="#e53935" stroke-width="2"/>
    <rect x="149" y="642" width="40" height="4" rx="2" fill="#e53935"/>
    <text x="169" y="656" font-size="13" font-weight="700" fill="#e53935" text-anchor="middle">مركز الدفع</text>
    <text x="169" y="678" font-size="11" fill="#546e7a" text-anchor="middle">Stripe / PayPal / Alipay · 10 قنوات</text>
    <text x="169" y="695" font-size="11" fill="#546e7a" text-anchor="middle">NOWPayments · USDT · 5 قنوات محلية</text>
  </g>

  <text x="500" y="810" font-size="12" fill="#78909c" text-anchor="middle">مسار القراءة الأساسي: اكتشاف ← قراءة ← تفاعل ← مزامنة التقدم · تعدد لغات i18n في المسار الكامل</text>
  <text x="988" y="818" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
