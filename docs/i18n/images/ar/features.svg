    <text x="169" y="150" font-size="11" fill="#546e7a" text-anchor="middle">تسجيل/دخول (JWT)</text>
    <text x="169" y="167" font-size="11" fill="#546e7a" text-anchor="middle">رف الكتب الشخصي</text>
