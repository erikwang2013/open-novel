    <text x="500" y="367" font-size="11" fill="#00897b" text-anchor="middle">أكثر من 12 لغة · قراءة متعددة الأجهزة · سحابي أصلي</text>
  </g>

  <!-- مركز المستخدم -->
  <g>
    <rect x="44" y="100" width="250" height="132" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
