<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">

  <text x="44" y="34" font-size="22" font-weight="700" fill="#263238">Open Novel — معمارية الميزات</text>
  <text x="44" y="54" font-size="12" fill="#78909c">Feature Modules</text>

  <!-- 中心到各功能组的连接线 -->
  <g stroke="#90a4ae" stroke-width="1.5">
    <line x1="390" y1="345" x2="294" y2="166"/>
    <line x1="390" y1="345" x2="294" y2="342"/>
    <line x1="390" y1="345" x2="294" y2="518"/>
    <line x1="610" y1="345" x2="706" y2="166"/>
    <line x1="610" y1="345" x2="706" y2="342"/>
    <line x1="610" y1="345" x2="706" y2="518"/>
    <polyline points="390,395 334,560 334,628 169,628"/>
  </g>

  <!-- 中心核心卡片 -->
  <g>
    <rect x="390" y="295" width="220" height="100" rx="14" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
    <text x="500" y="326" font-size="15" font-weight="700" fill="#263238" text-anchor="middle">منصة روايات Open Novel</text>
