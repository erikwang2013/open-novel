<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="756" viewBox="0 0 1000 756" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/>
    </marker>
  </defs>

  <text x="44" y="34" font-size="22" font-weight="700" fill="#263238">Open Novel — নিরাপত্তা আর্কিটেকচার</text>
  <text x="44" y="54" font-size="12" fill="#78909c">Security Architecture</text>

  <!-- ট্রান্সপোর্ট সিকিউরিটি -->
  <g>
    <rect x="44" y="80" width="912" height="112" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <rect x="60" y="92" width="86" height="24" rx="6" fill="#1e88e5"/>
    <text x="103" y="108" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">ট্রান্সপোর্ট সিকিউরিটি</text>
    <text x="154" y="108" font-size="11" fill="#1565c0">TRANSPORT</text>

    <g>
      <rect x="60" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="164" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">HTTPS / TLS 1.3</text>
      <text x="164" y="163" font-size="10" fill="#78909c" text-anchor="middle">এন্ড-টু-এন্ড এনক্রিপ্টেড</text>
    </g>
    <g>
      <rect x="288" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="392" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">HSTS</text>
      <text x="392" y="163" font-size="10" fill="#78909c" text-anchor="middle">ফোর্সড HTTPS রিডাইরেক্ট</text>
    </g>
    <g>
      <rect x="516" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="620" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">CDN WAF</text>
      <text x="620" y="163" font-size="10" fill="#78909c" text-anchor="middle">ওয়েব অ্যাপ ফায়ারওয়াল</text>
    </g>
    <g>
      <rect x="744" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="848" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">DDoS প্রোটেকশন</text>
      <text x="848" y="163" font-size="10" fill="#78909c" text-anchor="middle">ট্রাফিক ক্লিনিং · হাই-প্রোটেকশন</text>
    </g>
  </g>

  <line x1="500" y1="196" x2="500" y2="208" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- অ্যাক্সেস সিকিউরিটি -->
  <g>
    <rect x="44" y="212" width="912" height="168" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
    <rect x="60" y="224" width="86" height="24" rx="6" fill="#5e35b1"/>
    <text x="103" y="240" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">অ্যাক্সেস সিকিউরিটি</text>
    <text x="154" y="240" font-size="11" fill="#4527a0">ACCESS</text>

    <g>
      <rect x="60" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="164" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">JWT অথ + RefreshToken</text>
      <text x="164" y="295" font-size="10" fill="#78909c" text-anchor="middle">ডুয়াল টোকেন মেকানিজম</text>
    </g>
    <g>
      <rect x="288" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="392" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">OAuth2 থার্ড-পার্টি লগইন</text>
      <text x="392" y="295" font-size="10" fill="#78909c" text-anchor="middle">WeChat / Google ইত্যাদি</text>
    </g>
    <g>
      <rect x="516" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="620" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">API রেট-লিমিট (টোকেন বাকেট)</text>
      <text x="620" y="295" font-size="10" fill="#78909c" text-anchor="middle">অ্যান্টি-অ্যাবিউজ</text>
    </g>
    <g>
      <rect x="744" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="848" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">প্যারামিটার ভ্যালিডেশন (protovalidate)</text>
      <text x="848" y="295" font-size="10" fill="#78909c" text-anchor="middle">প্রোটোকল-লেভেল ভ্যালিডেশন</text>
    </g>
    <g>
      <rect x="60" y="328" width="440" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="280" y="347" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">অ্যাটাক ডিটেকশন security-go</text>
      <text x="280" y="359" font-size="10" fill="#78909c" text-anchor="middle">27 ডিটেক্টর · ইঞ্জেকশন / প্রোটোকল / ডেটা / ফাইল</text>
      <text x="280" y="371" font-size="10" fill="#78909c" text-anchor="middle">High / Critical ব্লক · Low / Medium শুধু লগ</text>
    </g>
    <g>
      <rect x="516" y="328" width="440" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="736" y="352" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">IP ব্ল্যাকলিস্ট নিষেধ</text>
      <text x="736" y="366" font-size="10" fill="#78909c" text-anchor="middle">60 সেকেন্ডে 5 আক্রমণ → 15 মিনিট নিষেধ</text>
    </g>

  </g>

  <line x1="500" y1="384" x2="500" y2="396" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- বিজনেস সিকিউরিটি -->
  <g>
    <rect x="44" y="400" width="912" height="112" rx="12" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
    <rect x="60" y="412" width="86" height="24" rx="6" fill="#fb8c00"/>
    <text x="103" y="428" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">বিজনেস সিকিউরিটি</text>
    <text x="154" y="428" font-size="11" fill="#e65100">BUSINESS</text>

    <g>
      <rect x="60" y="448" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="144" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">RBAC পারমিশন</text>
      <text x="144" y="483" font-size="10" fill="#78909c" text-anchor="middle">রোল-ভিত্তিক কন্ট্রোল</text>
    </g>
    <g>
      <rect x="240" y="448" width="168" height="58" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="324" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">পেমেন্ট কলব্যাক ভেরিফিকেশন</text>
      <text x="324" y="483" font-size="10" fill="#78909c" text-anchor="middle">HMAC / টোকেন · IPN চেকব্যাক</text>
    <text x="324" y="499" font-size="10" fill="#78909c" text-anchor="middle">PayPal verify-webhook · Alipay / WeChat RSA</text>
    </g>
    <g>
      <rect x="420" y="448" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="504" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">অ্যামাউন্ট চেক · Idempotency</text>
      <text x="504" y="483" font-size="10" fill="#78909c" text-anchor="middle">কলব্যাক অ্যামাউন্ট = অর্ডার অ্যামাউন্ট</text>
    </g>
    <g>
      <rect x="600" y="448" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="684" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">XSS ফিল্টার</text>
      <text x="684" y="483" font-size="10" fill="#78909c" text-anchor="middle">আউটপুট এস্কেপিং</text>
    </g>
    <g>
      <rect x="780" y="448" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="864" y="467" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">SQL ইনজেকশন প্রোটেকশন</text>
      <text x="864" y="483" font-size="10" fill="#78909c" text-anchor="middle">প্যারামিটারাইজড কোয়েরি</text>
    </g>
  </g>

  <line x1="500" y1="516" x2="500" y2="528" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ডেটা সিকিউরিটি -->
  <g>
    <rect x="44" y="532" width="912" height="112" rx="12" fill="#fce4ec" stroke="#d81b60" stroke-width="1.5"/>
    <rect x="60" y="544" width="86" height="24" rx="6" fill="#d81b60"/>
    <text x="103" y="560" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">ডেটা সিকিউরিটি</text>
    <text x="154" y="560" font-size="11" fill="#880e4f">DATA</text>

    <g>
      <rect x="60" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="144" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">সেনসিটিভ ফিল্ড AES এনক্রিপশন</text>
      <text x="144" y="615" font-size="10" fill="#78909c" text-anchor="middle">স্টোরেজ এনক্রিপশন</text>
    </g>
    <g>
      <rect x="240" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="324" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">পাসওয়ার্ড হ্যাশিং</text>
      <text x="324" y="615" font-size="10" fill="#78909c" text-anchor="middle">bcrypt / argon2</text>
    </g>
    <g>
      <rect x="420" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="504" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">কী ম্যানেজমেন্ট</text>
      <text x="504" y="615" font-size="10" fill="#78909c" text-anchor="middle">KMS / Vault</text>
    </g>
    <g>
      <rect x="600" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="684" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">রেপ্লিকা এনক্রিপশন</text>
      <text x="684" y="615" font-size="10" fill="#78909c" text-anchor="middle">রেপ্লিকেশন এনক্রিপশন</text>
    </g>
    <g>
      <rect x="780" y="580" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="864" y="599" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">লগ মাস্কিং</text>
      <text x="864" y="615" font-size="10" fill="#78909c" text-anchor="middle">সেনসিটিভ তথ্য লুকানো</text>
    </g>
  </g>

  <line x1="500" y1="648" x2="500" y2="660" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- অপস সিকিউরিটি -->
  <g>
    <rect x="44" y="664" width="912" height="76" rx="12" fill="#eceff1" stroke="#37474f" stroke-width="1.5"/>
    <rect x="60" y="676" width="86" height="24" rx="6" fill="#37474f"/>
    <text x="103" y="692" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">অপস সিকিউরিটি</text>
    <text x="154" y="692" font-size="11" fill="#455a64">OPS</text>

    <g>
      <rect x="258" y="676" width="200" height="36" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
      <text x="358" y="698" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">অডিট লগ</text>
    </g>
    <g>
      <rect x="482" y="676" width="200" height="36" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
      <text x="582" y="698" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">ক্যানারি রিলিজ</text>
    </g>
    <g>
      <rect x="706" y="676" width="200" height="36" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
      <text x="806" y="698" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">ভুলনেবিলিটি স্ক্যান</text>
    </g>
    <text x="806" y="720" font-size="10" fill="#78909c" text-anchor="middle">golangci-lint / govulncheck</text>
  </g>

  <text x="500" y="744" font-size="12" fill="#78909c" text-anchor="middle">ডিফেন্স-ইন-ডেপথ: ট্রান্সপোর্ট → অ্যাক্সেস → বিজনেস → ডেটা → অপস · লেয়ারড ডিফেন্স</text>
  <text x="988" y="744" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
</svg>
