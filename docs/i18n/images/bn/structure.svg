  <text x="500" y="610" font-size="12" fill="#78909c" text-anchor="middle">apps/ মাল্টি-এন্ড ফ্রন্টএন্ড · kratos/ Go-Kratos ব্যাকএন্ড · docs/ ডকস ও ডিজাইন · ফুল-স্ট্যাক স্ট্রাকচার</text>
  <text x="988" y="688" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
