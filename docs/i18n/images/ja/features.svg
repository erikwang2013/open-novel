    <text x="831" y="167" font-size="11" fill="#546e7a" text-anchor="middle">フォント・文字サイズ切替</text>
    <text x="831" y="184" font-size="11" fill="#546e7a" text-anchor="middle">ライト/ダークテーマ</text>
    <text x="831" y="201" font-size="11" fill="#546e7a" text-anchor="middle">オフラインキャッシュ</text>
    <text x="831" y="218" font-size="11" fill="#546e7a" text-anchor="middle">ページめくりアニメーション</text>
