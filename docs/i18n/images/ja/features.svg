    <text x="831" y="326" font-size="11" fill="#546e7a" text-anchor="middle">コメント・書評</text>
    <text x="831" y="343" font-size="11" fill="#546e7a" text-anchor="middle">いいね</text>
    <text x="831" y="360" font-size="11" fill="#546e7a" text-anchor="middle">お気に入り</text>
    <text x="831" y="377" font-size="11" fill="#546e7a" text-anchor="middle">通報・審査</text>
  </g>

  <!-- 検索・発見 -->
  <g>
    <rect x="44" y="452" width="250" height="132" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
    <rect x="149" y="466" width="40" height="4" rx="2" fill="#d81b60"/>
    <text x="169" y="480" font-size="13" font-weight="700" fill="#d81b60" text-anchor="middle">検索・発見</text>
    <text x="169" y="502" font-size="11" fill="#546e7a" text-anchor="middle">多言語形態素解析検索</text>
    <text x="169" y="519" font-size="11" fill="#546e7a" text-anchor="middle">人気ランキング</text>
    <text x="169" y="536" font-size="11" fill="#546e7a" text-anchor="middle">AI レコメンド</text>
    <text x="169" y="553" font-size="11" fill="#546e7a" text-anchor="middle">カテゴリ閲覧</text>
  </g>

  <!-- 管理バックエンド -->
  <g>
    <rect x="706" y="452" width="250" height="132" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="2"/>
    <rect x="811" y="466" width="40" height="4" rx="2" fill="#546e7a"/>
    <text x="831" y="480" font-size="13" font-weight="700" fill="#546e7a" text-anchor="middle">管理バックエンド</text>
    <text x="831" y="502" font-size="11" fill="#546e7a" text-anchor="middle">コンテンツ審査</text>
    <text x="831" y="519" font-size="11" fill="#546e7a" text-anchor="middle">ユーザー管理</text>
    <text x="831" y="536" font-size="11" fill="#546e7a" text-anchor="middle">データ統計</text>
    <text x="831" y="553" font-size="11" fill="#546e7a" text-anchor="middle">設定管理</text>
  </g>

  <text x="500" y="700" font-size="12" fill="#78909c" text-anchor="middle">コア読書リンク：発見 → 読書 → 交流 → 進捗同期 · 全リンク多言語 i18n</text>
  <text x="988" y="708" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
</svg>
