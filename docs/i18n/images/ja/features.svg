    <text x="169" y="360" font-size="11" fill="#546e7a" text-anchor="middle">カテゴリタグ</text>
    <text x="169" y="377" font-size="11" fill="#546e7a" text-anchor="middle">連載更新</text>
    <text x="169" y="394" font-size="11" fill="#546e7a" text-anchor="middle">多言語翻訳</text>
