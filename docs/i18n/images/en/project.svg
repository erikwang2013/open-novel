  <text x="500" y="560" font-size="12" fill="#78909c" text-anchor="middle">Milestone: MVP live in 12 weeks · Stack Go-Kratos / Flutter / HarmonyOS / MySQL / Redis / OpenSearch</text>
  <text x="988" y="628" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
