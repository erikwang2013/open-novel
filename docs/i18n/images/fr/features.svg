<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">

  <text x="44" y="34" font-size="22" font-weight="700" fill="#263238">Open Novel — Architecture fonctionnelle</text>
  <text x="44" y="54" font-size="12" fill="#78909c">Feature Modules</text>

  <!-- 中心到各功能组的连接线 -->
  <g stroke="#90a4ae" stroke-width="1.5">
    <line x1="390" y1="345" x2="294" y2="166"/>
    <line x1="390" y1="345" x2="294" y2="342"/>
    <line x1="390" y1="345" x2="294" y2="518"/>
    <line x1="610" y1="345" x2="706" y2="166"/>
    <line x1="610" y1="345" x2="706" y2="342"/>
    <line x1="610" y1="345" x2="706" y2="518"/>
  </g>

  <!-- 中心核心卡片 -->
  <g>
    <rect x="390" y="295" width="220" height="100" rx="14" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
    <text x="500" y="326" font-size="15" font-weight="700" fill="#263238" text-anchor="middle">Open Novel Plateforme de romans</text>
    <text x="500" y="347" font-size="10" fill="#78909c" text-anchor="middle">Global Multilingual Novel Platform</text>
    <text x="500" y="367" font-size="11" fill="#00897b" text-anchor="middle">12+ langues · Lecture multi-appareils · Cloud-native</text>
  </g>

  <!-- 用户中心 -->
  <g>
    <rect x="44" y="100" width="250" height="132" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <rect x="149" y="114" width="40" height="4" rx="2" fill="#1e88e5"/>
    <text x="169" y="128" font-size="13" font-weight="700" fill="#1e88e5" text-anchor="middle">Centre utilisateur</text>
    <text x="169" y="150" font-size="11" fill="#546e7a" text-anchor="middle">Inscription/connexion (JWT)</text>
    <text x="169" y="167" font-size="11" fill="#546e7a" text-anchor="middle">Bibliothèque personnelle</text>
    <text x="169" y="184" font-size="11" fill="#546e7a" text-anchor="middle">Synchronisation de la progression de lecture</text>
    <text x="169" y="201" font-size="11" fill="#546e7a" text-anchor="middle">Profil multilingue (12+ langues)</text>
  </g>

  <!-- 阅读体验 -->
  <g>
    <rect x="706" y="100" width="250" height="132" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
    <rect x="811" y="114" width="40" height="4" rx="2" fill="#5e35b1"/>
    <text x="831" y="128" font-size="13" font-weight="700" fill="#5e35b1" text-anchor="middle">Expérience de lecture</text>
    <text x="831" y="150" font-size="11" fill="#546e7a" text-anchor="middle">Lecture par chapitres</text>
    <text x="831" y="167" font-size="11" fill="#546e7a" text-anchor="middle">Changement de police et de taille</text>
    <text x="831" y="184" font-size="11" fill="#546e7a" text-anchor="middle">Thème clair/sombre</text>
    <text x="831" y="201" font-size="11" fill="#546e7a" text-anchor="middle">Cache hors ligne</text>
    <text x="831" y="218" font-size="11" fill="#546e7a" text-anchor="middle">Animation de tournage de page</text>
  </g>

  <!-- 书籍内容 -->
  <g>
    <rect x="44" y="276" width="250" height="132" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
    <rect x="149" y="290" width="40" height="4" rx="2" fill="#00897b"/>
    <text x="169" y="304" font-size="13" font-weight="700" fill="#00897b" text-anchor="middle">Contenu des livres</text>
    <text x="169" y="326" font-size="11" fill="#546e7a" text-anchor="middle">Métadonnées des livres</text>
    <text x="169" y="343" font-size="11" fill="#546e7a" text-anchor="middle">Gestion des chapitres</text>
    <text x="169" y="360" font-size="11" fill="#546e7a" text-anchor="middle">Catégories et tags</text>
    <text x="169" y="377" font-size="11" fill="#546e7a" text-anchor="middle">Mises à jour des séries</text>
    <text x="169" y="394" font-size="11" fill="#546e7a" text-anchor="middle">Traductions multilingues</text>
  </g>

  <!-- 互动社区 -->
  <g>
    <rect x="706" y="276" width="250" height="132" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
    <rect x="811" y="290" width="40" height="4" rx="2" fill="#fb8c00"/>
    <text x="831" y="304" font-size="13" font-weight="700" fill="#fb8c00" text-anchor="middle">Communauté interactive</text>
    <text x="831" y="326" font-size="11" fill="#546e7a" text-anchor="middle">Commentaires et critiques</text>
    <text x="831" y="343" font-size="11" fill="#546e7a" text-anchor="middle">Likes</text>
    <text x="831" y="360" font-size="11" fill="#546e7a" text-anchor="middle">Favoris</text>
    <text x="831" y="377" font-size="11" fill="#546e7a" text-anchor="middle">Signalement et modération</text>
  </g>

  <!-- 搜索发现 -->
  <g>
    <rect x="44" y="452" width="250" height="132" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
    <rect x="149" y="466" width="40" height="4" rx="2" fill="#d81b60"/>
    <text x="169" y="480" font-size="13" font-weight="700" fill="#d81b60" text-anchor="middle">Recherche et découverte</text>
    <text x="169" y="502" font-size="11" fill="#546e7a" text-anchor="middle">Recherche multilingue par segmentation</text>
    <text x="169" y="519" font-size="11" fill="#546e7a" text-anchor="middle">Classements populaires</text>
    <text x="169" y="536" font-size="11" fill="#546e7a" text-anchor="middle">Recommandations IA</text>
    <text x="169" y="553" font-size="11" fill="#546e7a" text-anchor="middle">Navigation par catégories</text>
    <text x="169" y="570" font-size="11" fill="#546e7a" text-anchor="middle">Recherches tendance / Suggestions de recherche</text>
  </g>

  <!-- 管理后台 -->
  <g>
    <rect x="706" y="452" width="250" height="132" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="2"/>
    <rect x="811" y="466" width="40" height="4" rx="2" fill="#546e7a"/>
    <text x="831" y="480" font-size="13" font-weight="700" fill="#546e7a" text-anchor="middle">Panneau d'administration</text>
    <text x="831" y="502" font-size="11" fill="#546e7a" text-anchor="middle">Modération du contenu</text>
    <text x="831" y="519" font-size="11" fill="#546e7a" text-anchor="middle">Gestion des utilisateurs</text>
    <text x="831" y="536" font-size="11" fill="#546e7a" text-anchor="middle">Statistiques</text>
    <text x="831" y="553" font-size="11" fill="#546e7a" text-anchor="middle">Gestion de la configuration</text>
    <text x="831" y="570" font-size="11" fill="#546e7a" text-anchor="middle">Statistiques / Journaux d'audit</text>
  </g>

  <text x="500" y="700" font-size="12" fill="#78909c" text-anchor="middle">Parcours de lecture principal : découverte → lecture → interaction → synchro de progression · i18n multilingue de bout en bout</text>
  <text x="988" y="708" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
</svg>
