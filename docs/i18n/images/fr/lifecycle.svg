  <g>
    <rect x="670" y="214" width="280" height="88" rx="12" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
    <circle cx="696" cy="242" r="13" fill="#5e35b1"/>
    <text x="696" y="247" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="718" y="247" font-size="13.5" font-weight="700" fill="#37474f">Tests &amp; vérification</text>
    <text x="930" y="247" font-size="10" fill="#90a4ae" text-anchor="end">Test</text>
    <text x="690" y="272" font-size="10.5" fill="#546e7a">go test · flutter test · tests limites et signature</text>
    <text x="690" y="289" font-size="10.5" fill="#78909c">scripts/smoke.sh smoke test des API</text>
  </g>
  <g>
    <rect x="360" y="214" width="280" height="88" rx="12" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
    <circle cx="386" cy="242" r="13" fill="#5e35b1"/>
    <text x="386" y="247" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="408" y="247" font-size="13.5" font-weight="700" fill="#37474f">Build &amp; packaging</text>
    <text x="620" y="247" font-size="10" fill="#90a4ae" text-anchor="end">Build</text>
    <text x="380" y="272" font-size="10.5" fill="#546e7a">go build (HTTP 8000 / gRPC 9000)</text>
    <text x="380" y="289" font-size="10.5" fill="#78909c">flutter build web/bureau/mobile + HarmonyOS</text>
  </g>
  <g>
    <rect x="50" y="214" width="280" height="88" rx="12" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
    <circle cx="76" cy="242" r="13" fill="#5e35b1"/>
    <text x="76" y="247" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <text x="98" y="247" font-size="13.5" font-weight="700" fill="#37474f">Publication de version</text>
    <text x="310" y="247" font-size="10" fill="#90a4ae" text-anchor="end">Release</text>
    <text x="70" y="272" font-size="10.5" fill="#546e7a">push main → CI incrémente le v* tag</text>
    <text x="70" y="289" font-size="10.5" fill="#78909c">changelog incrémental → Release (idempotent)</text>
  </g>

  <line x1="668" y1="258" x2="644" y2="258" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="358" y1="258" x2="334" y2="258" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 第 2 行 → 第 3 行（左端折返） -->
  <polyline points="190,302 190,318 190,332" fill="none" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

