  <g>
    <rect x="50" y="336" width="280" height="88" rx="12" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
    <circle cx="76" cy="364" r="13" fill="#00897b"/>
    <text x="76" y="369" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
    <text x="98" y="369" font-size="13.5" font-weight="700" fill="#37474f">Déploiement</text>
    <text x="310" y="369" font-size="10" fill="#90a4ae" text-anchor="end">Deploy</text>
    <text x="70" y="394" font-size="10.5" fill="#546e7a">stack docker compose · origine Nginx</text>
    <text x="70" y="411" font-size="10.5" fill="#78909c">accélération multi-CDN (config à chaud)</text>
  </g>
  <g>
    <rect x="360" y="336" width="280" height="88" rx="12" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
    <circle cx="386" cy="364" r="13" fill="#00897b"/>
    <text x="386" y="369" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
    <text x="408" y="369" font-size="13.5" font-weight="700" fill="#37474f">Supervision</text>
    <text x="620" y="369" font-size="10" fill="#90a4ae" text-anchor="end">Operate</text>
    <text x="380" y="394" font-size="10.5" fill="#546e7a">Prometheus · Grafana · logs ELK</text>
    <text x="380" y="411" font-size="10.5" fill="#78909c">requête des logs d'audit · endpoint pet live</text>
    <!-- 宠物贴纸：Novi 常驻运维节点 -->
    <g transform="translate(596,406)">
      <circle cx="0" cy="0" r="22" fill="#FDF3E3" stroke="#00897b" stroke-width="1.5"/>
      <path d="M-11 -6 L-15 -17 L-4 -10 Z" fill="#E8923F"/>
      <path d="M11 -6 L15 -17 L4 -10 Z" fill="#E8923F"/>
      <ellipse cx="0" cy="0" rx="14" ry="13" fill="#F0A04B"/>
      <ellipse cx="0" cy="2" rx="10" ry="9" fill="#FBDCA8"/>
      <circle cx="-5" cy="-1" r="4.6" fill="#FFFFFF" stroke="#2E4057" stroke-width="1.2"/>
      <circle cx="5" cy="-1" r="4.6" fill="#FFFFFF" stroke="#2E4057" stroke-width="1.2"/>
      <circle cx="-5" cy="-1" r="1.9" fill="#2E4057"/>
      <circle cx="5" cy="-1" r="1.9" fill="#2E4057"/>
      <path d="M-0.5 4 L-3 8 Q0 10 3 8 Z" fill="#E2725B"/>
    </g>
  </g>
  <g>
    <rect x="670" y="336" width="280" height="88" rx="12" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
    <circle cx="696" cy="364" r="13" fill="#00897b"/>
    <text x="696" y="369" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
    <text x="718" y="369" font-size="13.5" font-weight="700" fill="#37474f">Retour &amp; itération</text>
    <text x="930" y="369" font-size="10" fill="#90a4ae" text-anchor="end">Iterate</text>
    <text x="690" y="394" font-size="10.5" fill="#546e7a">suivi comportemental · rapports · logs</text>
    <text x="690" y="411" font-size="10.5" fill="#78909c">retour au backlog, prochaine planification</text>
  </g>

  <line x1="332" y1="380" x2="356" y2="380" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="642" y1="380" x2="666" y2="380" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= loop back ================= -->
  <path d="M810 424 L810 446 L28 446 L28 136 L46 136" fill="none" stroke="#00897b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
  <rect x="330" y="432" width="280" height="28" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
  <text x="470" y="451" font-size="11.5" font-weight="600" fill="#00695c" text-anchor="middle">Boucle de retour · itération continue</text>

  <!-- ================= milestones ================= -->
  <rect x="30" y="478" width="940" height="92" rx="12" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5"/>
  <rect x="46" y="490" width="104" height="24" rx="6" fill="#546e7a"/>
  <text x="98" y="506" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Jalons</text>
  <text x="164" y="506" font-size="10.5" fill="#78909c">MILESTONES · tout livré et tagué</text>

  <g font-size="11.5" font-weight="600" fill="#37474f" text-anchor="middle">
    <rect x="44" y="522" width="146" height="36" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="117" y="538">Socle backend</text>
    <text x="117" y="551" font-size="9.5" font-weight="400" fill="#78909c">Kratos, 8 domaines</text>

    <rect x="194" y="522" width="146" height="36" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="267" y="538">Multi-clients</text>
    <text x="267" y="551" font-size="9.5" font-weight="400" fill="#78909c">Flutter · HarmonyOS</text>

    <rect x="344" y="522" width="146" height="36" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="417" y="538">Durcissement sécurité</text>
    <text x="417" y="551" font-size="9.5" font-weight="400" fill="#78909c">JWT · RBAC · débit limité</text>

    <rect x="494" y="522" width="146" height="36" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="567" y="538">Accélération CDN</text>
    <text x="567" y="551" font-size="9.5" font-weight="400" fill="#78909c">Cloudflare + 3 autres</text>

    <rect x="644" y="522" width="146" height="36" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="717" y="538">Console d'admin</text>
    <text x="717" y="551" font-size="9.5" font-weight="400" fill="#78909c">10 modules fonctionnels</text>

    <rect x="794" y="522" width="146" height="36" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="867" y="538">VIP &amp; paiements</text>
    <text x="867" y="551" font-size="9.5" font-weight="400" fill="#78909c">11 canaux de paiement</text>
  </g>

  <!-- ================= footer ================= -->
  <text x="44" y="596" font-size="11" fill="#78909c">Automatisation : push main → GitHub Actions incrémente le v* tag + changelog Release (idempotent) · install.sh · smoke.sh · docker compose</text>
  <text x="44" y="616" font-size="11" fill="#00897b">Pet en direct : GET /api/pet.svg (en-tête X-Api-Version: v1) — sonde MySQL / Redis / OpenSearch, rend happy / degraded / down</text>
  <text x="988" y="634" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
