<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00897b"/>
    </marker>
  </defs>

  <text x="44" y="34" font-size="22" font-weight="700" fill="#263238">Open Novel — cycle de vie du projet</text>
  <text x="44" y="54" font-size="12" fill="#78909c">Project Lifecycle · Plan → Design → Code → Test → Build → Release → Deploy → Operate → Iterate</text>

  <!-- 阶段图例：独占一行，给非中文语种留足宽度 -->
  <g font-size="11" fill="#546e7a">
    <circle cx="612" cy="72" r="5" fill="#1e88e5"/>
    <text x="622" y="76">Conception</text>
    <circle cx="752" cy="72" r="5" fill="#5e35b1"/>
    <text x="762" y="76">Vérification</text>
    <circle cx="872" cy="72" r="5" fill="#00897b"/>
    <text x="882" y="76">Exploitation</text>
  </g>

  <!-- ================= 步骤 1-3 / plan ================= -->
  <g>
    <rect x="50" y="92" width="280" height="88" rx="12" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <circle cx="76" cy="120" r="13" fill="#1e88e5"/>
    <text x="76" y="125" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="98" y="125" font-size="13.5" font-weight="700" fill="#37474f">Planification des besoins</text>
    <text x="310" y="125" font-size="10" fill="#90a4ae" text-anchor="end">Plan</text>
    <text x="70" y="150" font-size="10.5" fill="#546e7a">Positionnement · langues · jalons</text>
    <text x="70" y="167" font-size="10.5" fill="#78909c">trio planning / roadmap / tasks</text>
  </g>
  <g>
    <rect x="360" y="92" width="280" height="88" rx="12" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <circle cx="386" cy="120" r="13" fill="#1e88e5"/>
    <text x="386" y="125" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="408" y="125" font-size="13.5" font-weight="700" fill="#37474f">Conception d'architecture</text>
    <text x="620" y="125" font-size="10" fill="#90a4ae" text-anchor="end">Design</text>
    <text x="380" y="150" font-size="10.5" fill="#546e7a">proto d'abord · services par domaine</text>
    <text x="380" y="167" font-size="10.5" fill="#78909c">modèle de données 23 tables · spec i18n</text>
  </g>
  <g>
    <rect x="670" y="92" width="280" height="88" rx="12" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <circle cx="696" cy="120" r="13" fill="#1e88e5"/>
    <text x="696" y="125" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="718" y="125" font-size="13.5" font-weight="700" fill="#37474f">Implémentation</text>
    <text x="930" y="125" font-size="10" fill="#90a4ae" text-anchor="end">Code</text>
    <text x="690" y="150" font-size="10.5" fill="#546e7a">8 domaines backend · 13 ARB client</text>
    <text x="690" y="167" font-size="10.5" fill="#78909c">10 modules admin · base multi-CDN</text>
  </g>

  <line x1="332" y1="136" x2="356" y2="136" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="642" y1="136" x2="666" y2="136" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 第 1 行 → 第 2 行（右端折返） -->
  <polyline points="810,180 810,196 810,210" fill="none" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

