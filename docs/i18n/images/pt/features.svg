    <text x="831" y="326" font-size="11" fill="#546e7a" text-anchor="middle">Comentários e resenhas</text>
    <text x="831" y="343" font-size="11" fill="#546e7a" text-anchor="middle">Curtidas</text>
    <text x="831" y="360" font-size="11" fill="#546e7a" text-anchor="middle">Favoritos</text>
    <text x="831" y="377" font-size="11" fill="#546e7a" text-anchor="middle">Denúncia e moderação</text>
  </g>

  <!-- Busca e descoberta -->
  <g>
    <rect x="44" y="452" width="250" height="132" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
    <rect x="149" y="466" width="40" height="4" rx="2" fill="#d81b60"/>
    <text x="169" y="480" font-size="13" font-weight="700" fill="#d81b60" text-anchor="middle">Busca e descoberta</text>
    <text x="169" y="502" font-size="11" fill="#546e7a" text-anchor="middle">Busca multilíngue</text>
    <text x="169" y="519" font-size="11" fill="#546e7a" text-anchor="middle">Rankings populares</text>
    <text x="169" y="536" font-size="11" fill="#546e7a" text-anchor="middle">Recomendação IA</text>
    <text x="169" y="553" font-size="11" fill="#546e7a" text-anchor="middle">Navegação por categorias</text>
    <text x="169" y="570" font-size="11" fill="#546e7a" text-anchor="middle">Buscas populares / Sugestões de busca</text>
  </g>

  <!-- Painel administrativo -->
  <g>
    <rect x="706" y="452" width="250" height="132" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="2"/>
    <rect x="811" y="466" width="40" height="4" rx="2" fill="#546e7a"/>
    <text x="831" y="480" font-size="13" font-weight="700" fill="#546e7a" text-anchor="middle">Painel administrativo</text>
    <text x="831" y="502" font-size="11" fill="#546e7a" text-anchor="middle">Moderação de conteúdo</text>
    <text x="831" y="519" font-size="11" fill="#546e7a" text-anchor="middle">Gestão de usuários</text>
    <text x="831" y="536" font-size="11" fill="#546e7a" text-anchor="middle">Estatísticas de dados</text>
    <text x="831" y="553" font-size="11" fill="#546e7a" text-anchor="middle">Gestão de configurações</text>
    <text x="831" y="570" font-size="11" fill="#546e7a" text-anchor="middle">Estatísticas de dados / Logs de auditoria</text>
  </g>

  <text x="500" y="700" font-size="12" fill="#78909c" text-anchor="middle">Fluxo de leitura: Descobrir → Ler → Interagir → Sincronizar · i18n em toda a cadeia</text>
  <text x="988" y="708" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
</svg>
