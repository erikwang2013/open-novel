<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">

  <text x="44" y="34" font-size="22" font-weight="700" fill="#263238">Open Novel — Diagrama de funcionalidades</text>
  <text x="44" y="54" font-size="12" fill="#78909c">Feature Modules</text>

  <!-- Linhas do centro aos grupos funcionais -->
  <g stroke="#90a4ae" stroke-width="1.5">
    <line x1="390" y1="345" x2="294" y2="166"/>
    <line x1="390" y1="345" x2="294" y2="342"/>
    <line x1="390" y1="345" x2="294" y2="518"/>
    <line x1="610" y1="345" x2="706" y2="166"/>
    <line x1="610" y1="345" x2="706" y2="342"/>
    <line x1="610" y1="345" x2="706" y2="518"/>
  </g>

  <!-- Cartao central -->
  <g>
    <rect x="390" y="295" width="220" height="100" rx="14" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
    <text x="500" y="326" font-size="15" font-weight="700" fill="#263238" text-anchor="middle">Plataforma de romances Open Novel</text>
    <text x="500" y="347" font-size="10" fill="#78909c" text-anchor="middle">Global Multilingual Novel Platform</text>
    <text x="500" y="367" font-size="11" fill="#00897b" text-anchor="middle">12+ idiomas · Multi-dispositivo · Cloud-native</text>
  </g>

  <!-- Central do usuário -->
  <g>
    <rect x="44" y="100" width="250" height="132" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <rect x="149" y="114" width="40" height="4" rx="2" fill="#1e88e5"/>
    <text x="169" y="128" font-size="13" font-weight="700" fill="#1e88e5" text-anchor="middle">Central do usuário</text>
    <text x="169" y="150" font-size="11" fill="#546e7a" text-anchor="middle">Registro / Login (JWT)</text>
    <text x="169" y="167" font-size="11" fill="#546e7a" text-anchor="middle">Estante pessoal</text>
    <text x="169" y="184" font-size="11" fill="#546e7a" text-anchor="middle">Sincronização de progresso</text>
    <text x="169" y="201" font-size="11" fill="#546e7a" text-anchor="middle">Perfis multilíngues (12+ idiomas)</text>
  </g>

  <!-- Experiência de leitura -->
  <g>
    <rect x="706" y="100" width="250" height="132" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
    <rect x="811" y="114" width="40" height="4" rx="2" fill="#5e35b1"/>
    <text x="831" y="128" font-size="13" font-weight="700" fill="#5e35b1" text-anchor="middle">Experiência de leitura</text>
    <text x="831" y="150" font-size="11" fill="#546e7a" text-anchor="middle">Leitura por capítulos</text>
    <text x="831" y="167" font-size="11" fill="#546e7a" text-anchor="middle">Troca de fonte e tamanho</text>
    <text x="831" y="184" font-size="11" fill="#546e7a" text-anchor="middle">Temas claro/escuro</text>
    <text x="831" y="201" font-size="11" fill="#546e7a" text-anchor="middle">Cache offline</text>
    <text x="831" y="218" font-size="11" fill="#546e7a" text-anchor="middle">Animação de página</text>
  </g>

  <!-- Conteúdo do livro -->
  <g>
    <rect x="44" y="276" width="250" height="132" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
    <rect x="149" y="290" width="40" height="4" rx="2" fill="#00897b"/>
    <text x="169" y="304" font-size="13" font-weight="700" fill="#00897b" text-anchor="middle">Conteúdo do livro</text>
    <text x="169" y="326" font-size="11" fill="#546e7a" text-anchor="middle">Metadados de livros</text>
    <text x="169" y="343" font-size="11" fill="#546e7a" text-anchor="middle">Gestão de capítulos</text>
    <text x="169" y="360" font-size="11" fill="#546e7a" text-anchor="middle">Tags de categorias</text>
    <text x="169" y="377" font-size="11" fill="#546e7a" text-anchor="middle">Atualizações seriadas</text>
    <text x="169" y="394" font-size="11" fill="#546e7a" text-anchor="middle">Tradução multilíngue</text>
  </g>

  <!-- Comunidade interativa -->
  <g>
    <rect x="706" y="276" width="250" height="132" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
    <rect x="811" y="290" width="40" height="4" rx="2" fill="#fb8c00"/>
