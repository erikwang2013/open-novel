  <text x="500" y="610" font-size="12" fill="#78909c" text-anchor="middle">apps/ 멀티 프런트엔드 · kratos/ Go-Kratos 백엔드 · docs/ 문서와 설계 · 풀스택 구조</text>
  <text x="988" y="688" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
