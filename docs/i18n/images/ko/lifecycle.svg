  <text x="44" y="34" font-size="22" font-weight="700" fill="#263238">Open Novel — 프로젝트 라이프사이클</text>
  <text x="44" y="54" font-size="12" fill="#78909c">Project Lifecycle · Plan → Design → Code → Test → Build → Release → Deploy → Operate → Iterate</text>

