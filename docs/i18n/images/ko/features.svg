    <text x="831" y="519" font-size="11" fill="#546e7a" text-anchor="middle">사용자 관리</text>
    <text x="831" y="536" font-size="11" fill="#546e7a" text-anchor="middle">데이터 통계</text>
    <text x="831" y="553" font-size="11" fill="#546e7a" text-anchor="middle">설정 관리</text>
