  <text x="500" y="700" font-size="12" fill="#78909c" text-anchor="middle">핵심 독서 링크: 발견 → 독서 → 상호작용 → 진행률 동기화 · 전체 링크 다국어 i18n</text>
  <text x="988" y="708" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
