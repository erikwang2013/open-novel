    <text x="831" y="343" font-size="11" fill="#546e7a" text-anchor="middle">좋아요</text>
    <text x="831" y="360" font-size="11" fill="#546e7a" text-anchor="middle">즐겨찾기</text>
    <text x="831" y="377" font-size="11" fill="#546e7a" text-anchor="middle">신고 검수</text>
