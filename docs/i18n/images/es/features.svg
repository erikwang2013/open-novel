    <text x="831" y="326" font-size="11" fill="#546e7a" text-anchor="middle">Comentarios y reseñas</text>
    <text x="831" y="343" font-size="11" fill="#546e7a" text-anchor="middle">Me gusta</text>
    <text x="831" y="360" font-size="11" fill="#546e7a" text-anchor="middle">Favoritos</text>
    <text x="831" y="377" font-size="11" fill="#546e7a" text-anchor="middle">Denuncia y moderación</text>
  </g>

  <!-- Búsqueda y descubrimiento -->
  <g>
    <rect x="44" y="452" width="250" height="132" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
    <rect x="149" y="466" width="40" height="4" rx="2" fill="#d81b60"/>
    <text x="169" y="480" font-size="13" font-weight="700" fill="#d81b60" text-anchor="middle">Búsqueda y descubrimiento</text>
    <text x="169" y="502" font-size="11" fill="#546e7a" text-anchor="middle">Búsqueda multilingüe</text>
    <text x="169" y="519" font-size="11" fill="#546e7a" text-anchor="middle">Rankings populares</text>
    <text x="169" y="536" font-size="11" fill="#546e7a" text-anchor="middle">Recomendación IA</text>
    <text x="169" y="553" font-size="11" fill="#546e7a" text-anchor="middle">Navegación por categorías</text>
  </g>

  <!-- Panel de administración -->
  <g>
    <rect x="706" y="452" width="250" height="132" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="2"/>
    <rect x="811" y="466" width="40" height="4" rx="2" fill="#546e7a"/>
    <text x="831" y="480" font-size="13" font-weight="700" fill="#546e7a" text-anchor="middle">Panel de administración</text>
    <text x="831" y="502" font-size="11" fill="#546e7a" text-anchor="middle">Moderación de contenido</text>
    <text x="831" y="519" font-size="11" fill="#546e7a" text-anchor="middle">Gestión de usuarios</text>
    <text x="831" y="536" font-size="11" fill="#546e7a" text-anchor="middle">Estadísticas de datos</text>
    <text x="831" y="553" font-size="11" fill="#546e7a" text-anchor="middle">Gestión de configuración</text>
  </g>

  <text x="500" y="700" font-size="12" fill="#78909c" text-anchor="middle">Flujo de lectura: Descubrir → Leer → Interactuar → Sincronizar · i18n en toda la cadena</text>
  <text x="988" y="708" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
</svg>
