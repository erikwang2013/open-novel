<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/>
    </marker>
  </defs>

  <text x="44" y="34" font-size="22" font-weight="700" fill="#263238">Open Novel — 安全架构图</text>
  <text x="44" y="54" font-size="12" fill="#78909c">Security Architecture</text>

  <!-- 传输安全 -->
  <g>
    <rect x="44" y="80" width="912" height="112" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <rect x="60" y="92" width="86" height="24" rx="6" fill="#1e88e5"/>
    <text x="103" y="108" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">传输安全</text>
    <text x="154" y="108" font-size="11" fill="#1565c0">TRANSPORT</text>

    <g>
      <rect x="60" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="164" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">HTTPS / TLS 1.3</text>
      <text x="164" y="163" font-size="10" fill="#78909c" text-anchor="middle">全链路加密传输</text>
    </g>
    <g>
      <rect x="288" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="392" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">HSTS</text>
      <text x="392" y="163" font-size="10" fill="#78909c" text-anchor="middle">强制 HTTPS 跳转</text>
    </g>
    <g>
      <rect x="516" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="620" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">CDN WAF</text>
      <text x="620" y="163" font-size="10" fill="#78909c" text-anchor="middle">Web 应用防火墙</text>
    </g>
    <g>
      <rect x="744" y="128" width="208" height="44" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="848" y="147" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">防 DDoS</text>
      <text x="848" y="163" font-size="10" fill="#78909c" text-anchor="middle">流量清洗 · 高防</text>
    </g>
  </g>

  <line x1="500" y1="196" x2="500" y2="208" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 接入安全 -->
  <g>
    <rect x="44" y="212" width="912" height="112" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
    <rect x="60" y="224" width="86" height="24" rx="6" fill="#5e35b1"/>
    <text x="103" y="240" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">接入安全</text>
    <text x="154" y="240" font-size="11" fill="#4527a0">ACCESS</text>

    <g>
      <rect x="60" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="164" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">JWT 认证 + RefreshToken</text>
      <text x="164" y="295" font-size="10" fill="#78909c" text-anchor="middle">双 Token 机制</text>
    </g>
    <g>
      <rect x="288" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="392" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">OAuth2 第三方登录</text>
      <text x="392" y="295" font-size="10" fill="#78909c" text-anchor="middle">微信 / Google 等</text>
    </g>
    <g>
      <rect x="516" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="620" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">接口限流（令牌桶）</text>
      <text x="620" y="295" font-size="10" fill="#78909c" text-anchor="middle">防刷防爆</text>
    </g>
    <g>
      <rect x="744" y="260" width="208" height="44" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="848" y="279" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">参数校验（protovalidate）</text>
      <text x="848" y="295" font-size="10" fill="#78909c" text-anchor="middle">协议级校验</text>
    </g>
  </g>

  <line x1="500" y1="328" x2="500" y2="340" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 业务安全 -->
  <g>
    <rect x="44" y="344" width="912" height="112" rx="12" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
    <rect x="60" y="356" width="86" height="24" rx="6" fill="#fb8c00"/>
    <text x="103" y="372" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">业务安全</text>
    <text x="154" y="372" font-size="11" fill="#e65100">BUSINESS</text>

    <g>
      <rect x="60" y="392" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="144" y="411" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">RBAC 权限</text>
      <text x="144" y="427" font-size="10" fill="#78909c" text-anchor="middle">角色权限控制</text>
    </g>
    <g>
      <rect x="240" y="392" width="168" height="56" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="324" y="411" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">支付回调验签（9 渠道）</text>
      <text x="324" y="427" font-size="10" fill="#78909c" text-anchor="middle">Stripe/NP HMAC · 本地 IPN 回查</text>
      <text x="324" y="443" font-size="10" fill="#78909c" text-anchor="middle">PayPal 官方验签 · 支付宝 RSA2</text>
    </g>
    <g>
      <rect x="420" y="392" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="504" y="411" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">金额强校验 · 幂等</text>
      <text x="504" y="427" font-size="10" fill="#78909c" text-anchor="middle">回调金额 = 订单金额</text>
    </g>
    <g>
      <rect x="600" y="392" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="684" y="411" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">XSS 过滤</text>
      <text x="684" y="427" font-size="10" fill="#78909c" text-anchor="middle">输出转义</text>
    </g>
    <g>
      <rect x="780" y="392" width="168" height="44" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="864" y="411" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">SQL 注入防护</text>
      <text x="864" y="427" font-size="10" fill="#78909c" text-anchor="middle">参数化查询</text>
    </g>
  </g>

  <line x1="500" y1="460" x2="500" y2="472" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 数据安全 -->
  <g>
    <rect x="44" y="476" width="912" height="112" rx="12" fill="#fce4ec" stroke="#d81b60" stroke-width="1.5"/>
    <rect x="60" y="488" width="86" height="24" rx="6" fill="#d81b60"/>
    <text x="103" y="504" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">数据安全</text>
    <text x="154" y="504" font-size="11" fill="#880e4f">DATA</text>

    <g>
      <rect x="60" y="524" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="144" y="543" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">敏感字段加密 AES</text>
      <text x="144" y="559" font-size="10" fill="#78909c" text-anchor="middle">存储加密</text>
    </g>
    <g>
      <rect x="240" y="524" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="324" y="543" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">密码哈希</text>
      <text x="324" y="559" font-size="10" fill="#78909c" text-anchor="middle">bcrypt / argon2</text>
    </g>
    <g>
      <rect x="420" y="524" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="504" y="543" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">渠道密钥 AES-GCM</text>
      <text x="504" y="559" font-size="10" fill="#78909c" text-anchor="middle">config 密钥加密存储</text>
    </g>
    <g>
      <rect x="600" y="524" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="684" y="543" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">数据库主从加密</text>
      <text x="684" y="559" font-size="10" fill="#78909c" text-anchor="middle">复制链路加密</text>
    </g>
    <g>
      <rect x="780" y="524" width="168" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="864" y="543" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">日志脱敏</text>
      <text x="864" y="559" font-size="10" fill="#78909c" text-anchor="middle">敏感信息隐藏</text>
    </g>
  </g>

  <line x1="500" y1="592" x2="500" y2="604" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 运维安全 -->
  <g>
    <rect x="44" y="608" width="912" height="76" rx="12" fill="#eceff1" stroke="#37474f" stroke-width="1.5"/>
    <rect x="60" y="620" width="86" height="24" rx="6" fill="#37474f"/>
    <text x="103" y="636" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">运维安全</text>
    <text x="154" y="636" font-size="11" fill="#455a64">OPS</text>

    <g>
      <rect x="258" y="620" width="200" height="36" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
      <text x="358" y="642" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">审计日志</text>
    </g>
    <g>
      <rect x="482" y="620" width="200" height="36" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
      <text x="582" y="642" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">灰度发布</text>
    </g>
    <g>
      <rect x="706" y="620" width="200" height="36" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
      <text x="806" y="642" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">漏洞扫描</text>
    </g>
    <text x="806" y="664" font-size="10" fill="#78909c" text-anchor="middle">golangci-lint / govulncheck</text>
  </g>

  <text x="500" y="688" font-size="12" fill="#78909c" text-anchor="middle">纵深防御：传输 → 接入 → 业务 → 数据 → 运维 · 分层设防全链路</text>
  <text x="988" y="688" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
</svg>
