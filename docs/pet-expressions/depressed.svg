@keyframes ex-palm { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2.52px) rotate(-4deg); } }
@keyframes ex-steam { 0% { transform: translateY(0); opacity: .7; } 100% { transform: translateY(-18.9px); opacity: 0; } }
@keyframes ex-shock { 0%,100% { transform: scaleX(.7); opacity: .4; } 50% { transform: scaleX(1.25); opacity: 1; } }
@keyframes ex-please { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3.78px); } }
@keyframes ex-drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4.2px); } }
@media (prefers-reduced-motion: reduce) {
  .ex-motion, [class*="ex-anim-"] { animation: none !important; }
}
