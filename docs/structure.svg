<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">

  <text x="44" y="34" font-size="22" font-weight="700" fill="#263238">Open Novel — 项目结构图</text>
  <text x="44" y="54" font-size="12" fill="#78909c">Project Structure</text>

  <!-- 树形连接线 -->
  <g stroke="#b0bec5" stroke-width="1.5">
    <line x1="44" y1="100" x2="120" y2="100"/>
    <line x1="80" y1="100" x2="80" y2="586"/>
    <line x1="80" y1="144" x2="120" y2="144"/>
    <line x1="80" y1="276" x2="120" y2="276"/>
    <line x1="80" y1="320" x2="120" y2="320"/>
    <line x1="80" y1="396" x2="120" y2="396"/>
    <line x1="80" y1="440" x2="120" y2="440"/>
    <line x1="80" y1="484" x2="120" y2="484"/>
    <line x1="80" y1="528" x2="120" y2="528"/>
    <line x1="80" y1="572" x2="120" y2="572"/>
    <line x1="100" y1="144" x2="100" y2="232"/>
    <line x1="100" y1="188" x2="140" y2="188"/>
    <line x1="100" y1="232" x2="140" y2="232"/>
    <line x1="100" y1="276" x2="100" y2="320"/>
    <line x1="100" y1="320" x2="140" y2="320"/>
    <line x1="188" y1="334" x2="188" y2="418"/>
    <line x1="188" y1="352" x2="228" y2="352"/>
    <line x1="188" y1="384" x2="228" y2="384"/>
  </g>

  <!-- 根目录 -->
  <rect x="120" y="86" width="110" height="28" rx="6" fill="#263238"/>
  <text x="175" y="105" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">open-novel/</text>

  <!-- 层级 1 -->
  <g>
    <rect x="120" y="130" width="96" height="28" rx="6" fill="#263238"/>
    <text x="168" y="149" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">apps/</text>
    <text x="248" y="149" font-size="12" fill="#78909c"># client/ 客户端 + admin/ 管理端</text>
  </g>
  <g>
    <rect x="120" y="262" width="96" height="28" rx="6" fill="#263238"/>
    <text x="168" y="281" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">kratos/</text>
    <text x="248" y="281" font-size="12" fill="#78909c"># Go-Kratos 框架源码（上游，原样保留）</text>
  </g>
  <g>
    <rect x="120" y="382" width="96" height="28" rx="6" fill="#263238"/>
    <text x="168" y="401" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">docs/</text>
    <text x="248" y="401" font-size="12" fill="#78909c"># 项目文档（规划、架构图、i18n README、打赏码）</text>
  </g>
  <g>
    <rect x="120" y="426" width="96" height="28" rx="6" fill="#263238"/>
    <text x="168" y="445" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">scripts/</text>
    <text x="248" y="445" font-size="12" fill="#78909c"># 构建与部署脚本（post-push.sh 自动发布、smoke.sh）</text>
  </g>
  <g>
    <rect x="120" y="470" width="96" height="28" rx="6" fill="#263238"/>
    <text x="168" y="489" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">.github/</text>
    <text x="248" y="489" font-size="12" fill="#78909c"># CI/CD：GitHub Actions 发布工作流（release.yml）</text>
  </g>

  <!-- 层级 2 -->
  <g>
    <rect x="140" y="174" width="96" height="28" rx="6" fill="#263238"/>
    <text x="188" y="193" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">flutter/</text>
    <text x="268" y="193" font-size="12" fill="#78909c"># Flutter 全平台（Web / Desktop / Mobile）</text>
  </g>
  <g>
    <rect x="140" y="218" width="96" height="28" rx="6" fill="#263238"/>
    <text x="188" y="237" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">harmonyos/</text>
    <text x="268" y="237" font-size="12" fill="#78909c"># HarmonyOS NEXT（ArkTS / ArkUI）</text>
  </g>
  <g>
    <rect x="140" y="306" width="96" height="28" rx="6" fill="#263238"/>
    <text x="188" y="325" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">backend/</text>
    <text x="268" y="325" font-size="12" fill="#78909c"># 业务后端：cmd/server + api/ + internal/ + biz/ + sql/ + opensearch/</text>
  </g>

  <!-- 层级 3：后端关键包 -->
  <g>
    <rect x="228" y="338" width="160" height="28" rx="6" fill="#37474f"/>
    <text x="308" y="357" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">internal/cdn/</text>
    <text x="420" y="357" font-size="12" fill="#78909c"># Provider 接口 + Manager + 5 个厂商 adapter（purge 广播）</text>
  </g>
  <g>
    <rect x="228" y="370" width="160" height="28" rx="6" fill="#37474f"/>
    <text x="308" y="389" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">biz/cdn_admin.go</text>
    <text x="420" y="389" font-size="12" fill="#78909c"># 管理端 CDN 配置 CRUD（启停热更新 · AES-GCM 加密）</text>
  </g>

  <!-- 文件 -->
  <g>
    <rect x="120" y="514" width="96" height="28" rx="6" fill="#607d8b"/>
    <text x="168" y="533" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">CLAUDE.md</text>
    <text x="248" y="533" font-size="12" fill="#78909c"># 项目协作规范</text>
  </g>
  <g>
    <rect x="120" y="558" width="96" height="28" rx="6" fill="#607d8b"/>
    <text x="168" y="577" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">README.md</text>
    <text x="248" y="577" font-size="12" fill="#78909c"># 项目说明文档</text>
  </g>

  <text x="500" y="642" font-size="12" fill="#78909c" text-anchor="middle">apps/ client+admin 前端 · kratos/ 框架源码 + kratos/backend 业务 · docs/ 文档与设计 · 全栈工程结构</text>
  <text x="988" y="708" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
</svg>
