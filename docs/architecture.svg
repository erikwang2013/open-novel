      <text x="828" y="448" font-size="10" fill="#78909c" text-anchor="middle">分章内容 · 阅读进度 · 分页</text>
    </g>
    <g>
      <rect x="46" y="464" width="300" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
      <text x="196" y="481" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">评论服务 Comment Service</text>
      <text x="196" y="496" font-size="10" fill="#78909c" text-anchor="middle">书评 · 点赞 · 举报审核</text>
    </g>
    <g>
      <rect x="362" y="464" width="300" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
      <text x="512" y="481" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">搜索服务 Search Service</text>
      <text x="512" y="496" font-size="10" fill="#78909c" text-anchor="middle">OpenSearch 多语言分词检索</text>
    </g>
    <g>
      <rect x="678" y="464" width="300" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
      <text x="828" y="481" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">推荐服务 Recommendation Service</text>
      <text x="828" y="496" font-size="10" fill="#78909c" text-anchor="middle">AI 推荐 · 用户行为分析</text>
    </g>
    <g>
      <rect x="46" y="512" width="300" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
      <text x="196" y="529" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">支付服务 Payment Service</text>
      <text x="196" y="544" font-size="10" fill="#78909c" text-anchor="middle">下单查单 · 渠道回调验签 · VIP 激活</text>
    </g>
    <g>
      <rect x="362" y="512" width="300" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
      <text x="512" y="529" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">管理服务 Admin Service</text>
      <text x="512" y="544" font-size="10" fill="#78909c" text-anchor="middle">统计 · 分类标签 · RBAC · CDN 配置</text>
    </g>
    <!-- 失效编排：internal/cdn Manager → 各厂商 purge API -->
    <g>
      <rect x="678" y="512" width="300" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
      <text x="828" y="529" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">CDN 失效编排 internal/cdn</text>
      <text x="828" y="544" font-size="10" fill="#78909c" text-anchor="middle">Manager 广播 4 厂商 purge API</text>
    </g>
  </g>

  <line x1="500" y1="584" x2="500" y2="610" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ 存储层 ============ -->
  <g>
    <rect x="46" y="584" width="86" height="24" rx="6" fill="#fb8c00"/>
