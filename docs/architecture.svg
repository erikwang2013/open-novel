      <text x="512" y="404" font-size="10" fill="#78909c" text-anchor="middle">元数据 · 分类标签 · 多语言</text>
    </g>
    <g>
      <rect x="678" y="372" width="300" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
      <text x="828" y="389" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">章节服务 Chapter Service</text>
      <text x="828" y="404" font-size="10" fill="#78909c" text-anchor="middle">分章内容 · 阅读进度 · 分页</text>
    </g>
    <g>
      <rect x="46" y="420" width="300" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
      <text x="196" y="437" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">评论服务 Comment Service</text>
      <text x="196" y="452" font-size="10" fill="#78909c" text-anchor="middle">书评 · 点赞 · 举报审核</text>
    </g>
    <g>
      <rect x="362" y="420" width="300" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
      <text x="512" y="437" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">搜索服务 Search Service</text>
      <text x="512" y="452" font-size="10" fill="#78909c" text-anchor="middle">OpenSearch 多语言分词检索</text>
    </g>
    <g>
      <rect x="678" y="420" width="300" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
      <text x="828" y="437" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">推荐服务 Recommendation Service</text>
      <text x="828" y="452" font-size="10" fill="#78909c" text-anchor="middle">AI 推荐 · 用户行为分析</text>
    </g>
  </g>

  <line x1="500" y1="468" x2="500" y2="492" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ 存储层 ============ -->
  <g>
    <rect x="30" y="496" width="940" height="92" rx="12" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
    <rect x="46" y="508" width="86" height="24" rx="6" fill="#fb8c00"/>
    <text x="89" y="524" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">存储层</text>
    <text x="140" y="524" font-size="11" fill="#e65100">STORAGE</text>

    <g>
      <rect x="46" y="544" width="208" height="34" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="150" y="559" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">MySQL 8 · 主从读写分离</text>
      <text x="150" y="573" font-size="10" fill="#78909c" text-anchor="middle">库名 novel · 表前缀 novel_</text>
    </g>
    <g>
      <rect x="270" y="544" width="208" height="34" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="374" y="559" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Redis Cluster</text>
      <text x="374" y="573" font-size="10" fill="#78909c" text-anchor="middle">热点缓存 · 会话 · 限流计数</text>
    </g>
    <g>
      <rect x="494" y="544" width="208" height="34" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="598" y="559" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">OpenSearch 2.x</text>
      <text x="598" y="573" font-size="10" fill="#78909c" text-anchor="middle">多语言分词器 · 搜索索引</text>
    </g>
    <g>
      <rect x="718" y="544" width="208" height="34" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="822" y="559" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">对象存储 OSS</text>
      <text x="822" y="573" font-size="10" fill="#78909c" text-anchor="middle">封面 / 素材 / 静态资源</text>
    </g>
  </g>

  <line x1="500" y1="592" x2="500" y2="616" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ 运维层 ============ -->
  <g>
    <rect x="30" y="620" width="940" height="92" rx="12" fill="#fce4ec" stroke="#d81b60" stroke-width="1.5"/>
    <rect x="46" y="632" width="86" height="24" rx="6" fill="#d81b60"/>
    <text x="89" y="648" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">运维层</text>
    <text x="140" y="648" font-size="11" fill="#880e4f">OPS</text>

    <g>
