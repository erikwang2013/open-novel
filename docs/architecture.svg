      <text x="150" y="631" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">MySQL 8 · 主从读写分离</text>
      <text x="150" y="645" font-size="10" fill="#78909c" text-anchor="middle">库名 novel · 表前缀 novel_</text>
    </g>
    <g>
      <rect x="270" y="616" width="208" height="54" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="374" y="631" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Redis Cluster</text>
      <text x="374" y="645" font-size="10" fill="#78909c" text-anchor="middle">热点缓存 · 会话 · 限流计数</text>
      <text x="374" y="661" font-size="10" fill="#78909c" text-anchor="middle">L1 进程内 ristretto · 30s TTL</text>
    </g>
    <g>
      <rect x="494" y="616" width="208" height="34" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="598" y="631" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">OpenSearch 2.x</text>
      <text x="598" y="645" font-size="10" fill="#78909c" text-anchor="middle">多语言分词器 · 搜索索引</text>
    </g>
    <g>
      <rect x="718" y="616" width="208" height="34" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
      <text x="822" y="631" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">novel_cdn_provider</text>
      <text x="822" y="645" font-size="10" fill="#78909c" text-anchor="middle">CDN 厂商配置 · AES-GCM 加密</text>
    </g>
  </g>

  <line x1="500" y1="708" x2="500" y2="734" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ 运维层 ============ -->
  <g>
    <rect x="46" y="708" width="86" height="24" rx="6" fill="#d81b60"/>
    <text x="89" y="724" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">运维层</text>
    <text x="140" y="724" font-size="11" fill="#880e4f">OPS</text>

    <rect x="30" y="736" width="940" height="92" rx="12" fill="#fce4ec" stroke="#d81b60" stroke-width="1.5"/>

    <g>
      <rect x="46" y="740" width="208" height="34" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="150" y="762" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">Prometheus + Grafana</text>
    </g>
    <g>
      <rect x="270" y="740" width="208" height="34" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="374" y="762" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">ELK 日志聚合分析</text>
    </g>
    <g>
      <rect x="494" y="740" width="208" height="34" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="598" y="762" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">CI/CD · GitHub Actions</text>
    </g>
    <g>
      <rect x="718" y="740" width="208" height="34" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="822" y="762" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">配置中心 · 密钥管理</text>
    </g>
  </g>

  <text x="500" y="852" font-size="12" fill="#78909c" text-anchor="middle">全链路：多语言 i18n · JWT 认证 · 限流熔断 · 支付验签 · 链路追踪 · 可观测性</text>
  <text x="988" y="858" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
</svg>
