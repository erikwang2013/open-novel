      <text x="150" y="690" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">Prometheus + Grafana</text>
    </g>
    <g>
      <rect x="270" y="668" width="208" height="34" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="374" y="690" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">ELK 日志聚合分析</text>
    </g>
    <g>
      <rect x="494" y="668" width="208" height="34" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="598" y="690" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">CI/CD · GitHub Actions</text>
    </g>
    <g>
      <rect x="718" y="668" width="208" height="34" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
      <text x="822" y="690" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">配置中心 · 密钥管理</text>
    </g>
  </g>

  <text x="500" y="740" font-size="12" fill="#78909c" text-anchor="middle">全链路：多语言 i18n · JWT 认证 · 限流熔断 · 链路追踪 · 可观测性</text>
  <text x="988" y="748" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
