      <text x="266" y="270" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">Nginx + CDN · 静态资源 / 负载均衡 / 反向代理</text>
    </g>
    <g>
      <rect x="510" y="248" width="440" height="34" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
