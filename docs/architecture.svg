    <g>
      <rect x="362" y="416" width="300" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
      <text x="512" y="433" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">书籍服务 Book Service</text>
      <text x="512" y="448" font-size="10" fill="#78909c" text-anchor="middle">元数据 · 分类标签 · 多语言</text>
    </g>
    <g>
