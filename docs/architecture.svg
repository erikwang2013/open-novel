<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="864" viewBox="0 0 1000 864" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/>
    </marker>
  </defs>

  <text x="44" y="34" font-size="22" font-weight="700" fill="#263238">Open Novel — 系统架构图</text>
  <text x="44" y="54" font-size="12" fill="#78909c">Global Multilingual Novel Platform · System Architecture</text>

  <!-- ============ 客户端层 ============ -->
  <g>
    <rect x="30" y="72" width="940" height="96" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <rect x="46" y="84" width="86" height="24" rx="6" fill="#1e88e5"/>
    <text x="89" y="100" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">客户端层</text>
    <text x="140" y="100" font-size="11" fill="#1565c0">CLIENT</text>

    <g>
      <rect x="46" y="120" width="208" height="34" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="150" y="142" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">Flutter Web</text>
    </g>
    <g>
      <rect x="270" y="120" width="208" height="34" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="374" y="142" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">Flutter Desktop</text>
    </g>
    <g>
      <rect x="494" y="120" width="208" height="34" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="598" y="142" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">Flutter Mobile</text>
    </g>
    <g>
      <rect x="718" y="120" width="208" height="34" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
      <text x="822" y="142" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">HarmonyOS App</text>
    </g>
  </g>

  <line x1="500" y1="172" x2="500" y2="198" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ 网关层 ============ -->
  <g>
    <rect x="30" y="204" width="940" height="140" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
    <rect x="46" y="216" width="86" height="24" rx="6" fill="#5e35b1"/>
    <text x="89" y="232" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">网关层</text>
    <text x="140" y="232" font-size="11" fill="#4527a0">GATEWAY · INGRESS</text>

    <!-- CDN 子层：GeoDNS 双线 + 4 厂商 -->
    <rect x="46" y="250" width="560" height="84" rx="8" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="58" y="266" font-size="11" fill="#4527a0">CDN 层 · GeoDNS 双线分流（CNAME）</text>
    <g>
      <rect x="56" y="272" width="262" height="30" rx="6" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="187" y="291" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Cloudflare · 海外线</text>
    </g>
    <g>
      <rect x="334" y="272" width="262" height="30" rx="6" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="465" y="291" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">AWS CloudFront · 海外线</text>
    </g>
    <g>
      <rect x="56" y="306" width="262" height="30" rx="6" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="187" y="325" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">阿里云 CDN · 中国线</text>
    </g>
    <g>
      <rect x="334" y="306" width="262" height="30" rx="6" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="465" y="325" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">腾讯云 CDN · 中国线</text>
    </g>

    <!-- 源站：Nginx → Go-Kratos -->
    <g>
      <rect x="630" y="250" width="340" height="30" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="800" y="269" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Nginx 源站 · 回源 IP 白名单</text>
    </g>
    <g>
      <rect x="630" y="312" width="340" height="30" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
      <text x="800" y="331" font-size="12" font-weight="600" fill="#37474f" text-anchor="middle">Go-Kratos API 网关 · gRPC / HTTP 双协议</text>
    </g>
    <line x1="608" y1="269" x2="628" y2="269" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="800" y1="280" x2="800" y2="310" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <line x1="500" y1="348" x2="500" y2="374" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ 服务层 ============ -->
  <g>
    <rect x="30" y="380" width="940" height="200" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
    <rect x="46" y="392" width="86" height="24" rx="6" fill="#00897b"/>
    <text x="89" y="408" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">服务层</text>
    <text x="140" y="408" font-size="11" fill="#00695c">SERVICE</text>

    <g>
