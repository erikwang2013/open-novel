    <rect x="706" y="628" width="250" height="132" rx="8" fill="#ffffff" stroke="#26a69a" stroke-width="2"/>
    <rect x="811" y="642" width="40" height="4" rx="2" fill="#26a69a"/>
    <text x="831" y="656" font-size="13" font-weight="700" fill="#26a69a" text-anchor="middle">数据统计</text>
    <text x="831" y="678" font-size="11" fill="#546e7a" text-anchor="middle">运营仪表盘（起始页）</text>
    <text x="831" y="695" font-size="11" fill="#546e7a" text-anchor="middle">订单 / 收入报表</text>
