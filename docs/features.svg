  <text x="500" y="850" font-size="12" fill="#78909c" text-anchor="middle">核心阅读链路：发现 → 阅读 → 互动 → 进度同步 · 全链路多语言 i18n · 支付与 VIP 商业化</text>
  <text x="988" y="858" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
