<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="862" viewBox="0 0 1000 862" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">

  <text x="44" y="34" font-size="22" font-weight="700" fill="#263238">Open Novel — 功能架构图</text>
