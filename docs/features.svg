<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">

  <text x="44" y="34" font-size="22" font-weight="700" fill="#263238">Open Novel — 功能架构图</text>
  <text x="44" y="54" font-size="12" fill="#78909c">Feature Modules</text>

  <!-- 中心到各功能组的连接线 -->
  <g stroke="#90a4ae" stroke-width="1.5">
    <line x1="390" y1="345" x2="294" y2="166"/>
    <line x1="390" y1="345" x2="294" y2="342"/>
    <line x1="390" y1="345" x2="294" y2="518"/>
    <line x1="610" y1="345" x2="706" y2="166"/>
    <line x1="610" y1="345" x2="706" y2="342"/>
    <line x1="610" y1="345" x2="706" y2="518"/>
  </g>

  <!-- 中心核心卡片 -->
  <g>
    <rect x="390" y="295" width="220" height="100" rx="14" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
    <text x="500" y="326" font-size="15" font-weight="700" fill="#263238" text-anchor="middle">Open Novel 小说平台</text>
    <text x="500" y="347" font-size="10" fill="#78909c" text-anchor="middle">Global Multilingual Novel Platform</text>
    <text x="500" y="367" font-size="11" fill="#00897b" text-anchor="middle">12+ 语种 · 多端阅读 · 云原生</text>
  </g>

  <!-- 用户中心 -->
  <g>
    <rect x="44" y="100" width="250" height="132" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2"/>
    <rect x="149" y="114" width="40" height="4" rx="2" fill="#1e88e5"/>
    <text x="169" y="128" font-size="13" font-weight="700" fill="#1e88e5" text-anchor="middle">用户中心</text>
    <text x="169" y="150" font-size="11" fill="#546e7a" text-anchor="middle">注册登录（JWT）</text>
    <text x="169" y="167" font-size="11" fill="#546e7a" text-anchor="middle">个人书架</text>
    <text x="169" y="184" font-size="11" fill="#546e7a" text-anchor="middle">阅读进度同步</text>
    <text x="169" y="201" font-size="11" fill="#546e7a" text-anchor="middle">多语言资料（12+ 语种）</text>
  </g>

  <!-- 阅读体验 -->
  <g>
    <rect x="706" y="100" width="250" height="132" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
    <rect x="811" y="114" width="40" height="4" rx="2" fill="#5e35b1"/>
    <text x="831" y="128" font-size="13" font-weight="700" fill="#5e35b1" text-anchor="middle">阅读体验</text>
    <text x="831" y="150" font-size="11" fill="#546e7a" text-anchor="middle">分章阅读</text>
    <text x="831" y="167" font-size="11" fill="#546e7a" text-anchor="middle">字体字号切换</text>
    <text x="831" y="184" font-size="11" fill="#546e7a" text-anchor="middle">深浅主题</text>
    <text x="831" y="201" font-size="11" fill="#546e7a" text-anchor="middle">离线缓存</text>
    <text x="831" y="218" font-size="11" fill="#546e7a" text-anchor="middle">翻页动画</text>
  </g>

  <!-- 书籍内容 -->
  <g>
    <rect x="44" y="276" width="250" height="132" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
    <rect x="149" y="290" width="40" height="4" rx="2" fill="#00897b"/>
    <text x="169" y="304" font-size="13" font-weight="700" fill="#00897b" text-anchor="middle">书籍内容</text>
    <text x="169" y="326" font-size="11" fill="#546e7a" text-anchor="middle">书籍元数据</text>
    <text x="169" y="343" font-size="11" fill="#546e7a" text-anchor="middle">章节管理</text>
    <text x="169" y="360" font-size="11" fill="#546e7a" text-anchor="middle">分类标签</text>
    <text x="169" y="377" font-size="11" fill="#546e7a" text-anchor="middle">连载更新</text>
    <text x="169" y="394" font-size="11" fill="#546e7a" text-anchor="middle">多语言翻译</text>
  </g>

  <!-- 互动社区 -->
  <g>
    <rect x="706" y="276" width="250" height="132" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2"/>
    <rect x="811" y="290" width="40" height="4" rx="2" fill="#fb8c00"/>
    <text x="831" y="304" font-size="13" font-weight="700" fill="#fb8c00" text-anchor="middle">互动社区</text>
    <text x="831" y="326" font-size="11" fill="#546e7a" text-anchor="middle">评论书评</text>
    <text x="831" y="343" font-size="11" fill="#546e7a" text-anchor="middle">点赞</text>
    <text x="831" y="360" font-size="11" fill="#546e7a" text-anchor="middle">收藏</text>
    <text x="831" y="377" font-size="11" fill="#546e7a" text-anchor="middle">举报审核</text>
  </g>

  <!-- 搜索发现 -->
  <g>
    <rect x="44" y="452" width="250" height="132" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2"/>
    <rect x="149" y="466" width="40" height="4" rx="2" fill="#d81b60"/>
    <text x="169" y="480" font-size="13" font-weight="700" fill="#d81b60" text-anchor="middle">搜索发现</text>
    <text x="169" y="502" font-size="11" fill="#546e7a" text-anchor="middle">多语言分词搜索</text>
    <text x="169" y="519" font-size="11" fill="#546e7a" text-anchor="middle">热门榜单</text>
    <text x="169" y="536" font-size="11" fill="#546e7a" text-anchor="middle">AI 推荐</text>
    <text x="169" y="553" font-size="11" fill="#546e7a" text-anchor="middle">分类浏览</text>
  </g>

  <!-- 管理后台 -->
  <g>
    <rect x="706" y="452" width="250" height="132" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="2"/>
    <rect x="811" y="466" width="40" height="4" rx="2" fill="#546e7a"/>
    <text x="831" y="480" font-size="13" font-weight="700" fill="#546e7a" text-anchor="middle">管理后台</text>
    <text x="831" y="502" font-size="11" fill="#546e7a" text-anchor="middle">内容审核</text>
    <text x="831" y="519" font-size="11" fill="#546e7a" text-anchor="middle">用户管理</text>
    <text x="831" y="536" font-size="11" fill="#546e7a" text-anchor="middle">数据统计</text>
    <text x="831" y="553" font-size="11" fill="#546e7a" text-anchor="middle">配置管理</text>
  </g>

  <text x="500" y="700" font-size="12" fill="#78909c" text-anchor="middle">核心阅读链路：发现 → 阅读 → 互动 → 进度同步 · 全链路多语言 i18n</text>
  <text x="988" y="708" font-size="11" fill="#90a4ae" opacity="0.55" text-anchor="end">https://erik.xyz</text>
</svg>
